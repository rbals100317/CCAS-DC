<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코너베스트</title>

  <style>
    /* =====================================================
       🎨 디자인 수정 팁:
       --primary: 헤더/버튼 주색상 (현재 네이비)
       --accent: 강조색 (현재 오렌지)
       --bg: 페이지 배경색
       --border: 테두리색
    ===================================================== */
    :root {
      --primary: #1a3f7a;
      --primary-dark: #122d58;
      --accent: #e05c00;
      --bg: #e8e8e8;
      --surface: #ffffff;
      --border: #c0c0c0;
      --border-light: #e0e0e0;
      --text: #222222;
      --text-muted: #777777;
      --notice-bg: #fff8e1;
      --danger: #cc2222;
      --success: #1a7a3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', '맑은 고딕', Dotum, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }
    button { cursor: pointer; font-family: inherit; font-size: 12px; }
    input, textarea, select { font-family: inherit; font-size: 13px; }

    /* ── 헤더 ── */
    #header { background: var(--primary); color: #fff; padding: 0; border-bottom: 3px solid var(--accent); }
    #header-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; }
    #site-title {
      /* 💡 사이트 이름 스타일 수정: font-size, letter-spacing 등 */
      font-size: 20px; font-weight: 900; letter-spacing: -0.5px; color: #fff; cursor: pointer;
    }
    #site-title span { color: var(--accent); }
    #header-user { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    #header-user .user-name { color: #ffd080; font-weight: bold; }
    #header-user button { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 3px; }
    #header-user button:hover { background: rgba(255,255,255,0.25); }

    /* ── 카테고리 탭 ── */
    #category-bar { background: var(--primary-dark); display: flex; align-items: center; padding: 0 16px; overflow-x: auto; }
    .cat-tab { padding: 8px 14px; color: rgba(255,255,255,0.7); cursor: pointer; font-size: 12px; border-bottom: 3px solid transparent; white-space: nowrap; }
    .cat-tab:hover { color: #fff; }
    .cat-tab.active { color: #fff; border-bottom-color: var(--accent); font-weight: bold; }

    /* ── 레이아웃 ── */
    #main { max-width: 980px; margin: 14px auto; padding: 0 8px; }

    /* ── 공통 카드 ── */
    .card { background: var(--surface); border: 1px solid var(--border); }
    .card-header { background: #f5f5f5; border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
    .card-header h2 { font-size: 14px; font-weight: bold; }

    /* ── 게시글 목록 테이블 ── */
    #post-table { width: 100%; border-collapse: collapse; }
    #post-table th { background: #f0f0f0; border: 1px solid var(--border); padding: 6px 8px; text-align: center; font-size: 12px; color: #555; font-weight: bold; }
    #post-table td { border: 1px solid var(--border-light); padding: 6px 8px; font-size: 13px; }
    #post-table tr:hover td { background: #f9f9ff; }
    .post-row td { vertical-align: middle; }
    .post-num { text-align: center; color: var(--text-muted); width: 55px; }
    .post-cat { text-align: center; width: 60px; }
    .post-cat span { background: var(--primary); color: #fff; padding: 2px 6px; border-radius: 2px; font-size: 11px; }
    .post-title-cell { }
    .post-title-link { color: #1a1a1a; font-size: 13px; }
    .post-title-link:hover { color: var(--primary); }
    .post-title-link .comment-count { color: var(--accent); font-size: 11px; margin-left: 4px; }
    .post-author { text-align: center; width: 80px; color: var(--text-muted); }
    .post-date { text-align: center; width: 80px; color: var(--text-muted); font-size: 11px; }
    .post-views { text-align: center; width: 50px; color: var(--text-muted); font-size: 11px; }
    /* 공지 글 스타일 */
    .post-row.notice td { background: var(--notice-bg); }
    .post-row.notice .post-num { color: var(--accent); font-weight: bold; }
    .post-row.pinned .post-title-link { font-weight: bold; }
    .pin-badge { background: var(--accent); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 2px; margin-right: 5px; }
    .new-badge { color: var(--danger); font-size: 11px; margin-left: 3px; font-weight: bold; }

    /* ── 페이징 ── */
    #pagination { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 12px; }
    .page-btn { border: 1px solid var(--border); background: var(--surface); padding: 5px 9px; color: var(--text); border-radius: 2px; min-width: 30px; text-align: center; }
    .page-btn:hover { background: #eef; border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ── 쓰기 버튼 영역 ── */
    #board-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .btn { border: none; padding: 6px 14px; border-radius: 3px; font-size: 12px; font-weight: bold; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: #c45000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #aa1111; }
    .btn-outline { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f0f0f0; }

    /* ── 검색 ── */
    #search-bar { display: flex; gap: 4px; }
    #search-bar input { border: 1px solid var(--border); padding: 5px 8px; width: 180px; }
    #search-bar select { border: 1px solid var(--border); padding: 5px; }

    /* ── 게시글 상세 ── */
    #post-detail { background: var(--surface); border: 1px solid var(--border); }
    .post-detail-header { padding: 12px 14px; border-bottom: 1px solid var(--border-light); }
    .post-detail-title { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
    .post-detail-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }
    .post-detail-meta span { display: flex; align-items: center; gap: 3px; }
    .post-detail-body { padding: 16px 14px; min-height: 200px; line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
    .post-detail-actions { padding: 8px 14px; border-top: 1px solid var(--border-light); display: flex; gap: 6px; justify-content: center; }
    .back-btn { color: var(--primary); font-size: 12px; cursor: pointer; margin-bottom: 8px; display: inline-block; }
    .back-btn:hover { text-decoration: underline; }

    /* ── 댓글 ── */
    #comment-section { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); }
    .comment-header { background: #f0f0f0; border-bottom: 1px solid var(--border); padding: 7px 12px; font-weight: bold; font-size: 13px; }
    .comment-list { }
    .comment-item { border-bottom: 1px solid var(--border-light); padding: 10px 14px; }
    .comment-item:last-child { border-bottom: none; }
    .comment-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: flex; gap: 10px; align-items: center; }
    .comment-author { font-weight: bold; color: var(--text); }
    .comment-body { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .comment-write { padding: 12px 14px; border-top: 1px solid var(--border); background: #fafafa; }
    .comment-write textarea { width: 100%; border: 1px solid var(--border); padding: 8px; resize: vertical; min-height: 70px; border-radius: 2px; }
    .comment-write-actions { margin-top: 6px; display: flex; justify-content: flex-end; }
    .comment-delete { color: var(--danger); font-size: 11px; cursor: pointer; margin-left: 8px; }
    .comment-delete:hover { text-decoration: underline; }
    .no-comments { padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px; }

    /* ── 글쓰기 폼 ── */
    #write-form { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 4px; }
    .form-row input, .form-row select, .form-row textarea { width: 100%; border: 1px solid var(--border); padding: 8px; border-radius: 2px; }
    .form-row textarea { min-height: 350px; resize: vertical; line-height: 1.6; }
    .form-row input:focus, .form-row textarea:focus, .form-row select:focus { outline: none; border-color: var(--primary); }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── 로그인 / 회원가입 ── */
    #login-box { max-width: 380px; margin: 60px auto; background: var(--surface); border: 1px solid var(--border); padding: 30px; }
    #login-box h2 { font-size: 16px; margin-bottom: 20px; text-align: center; color: var(--primary); }
    #login-box .form-row input { padding: 9px; }
    #login-box .btn { width: 100%; padding: 10px; font-size: 14px; margin-bottom: 8px; }
    #login-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
    .login-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; color: var(--text-muted); font-size: 13px; font-weight: bold; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .login-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    #login-error, #register-error { color: var(--danger); font-size: 12px; margin-top: 6px; text-align: center; }

    /* ── 관리자 패널 ── */
    #admin-panel { background: var(--surface); border: 1px solid var(--border); }
    .admin-section { padding: 14px; border-bottom: 1px solid var(--border-light); }
    .admin-section h3 { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
    .user-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 12px; }
    .user-row:last-child { border-bottom: none; }
    .user-row .uname { flex: 1; font-weight: bold; }
    .banned-badge { background: var(--danger); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 2px; }
    .admin-badge { background: var(--primary); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 2px; }
    .admin-input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .admin-input-row input { flex: 1; border: 1px solid var(--border); padding: 6px 8px; border-radius: 2px; }

    /* ── 유틸 ── */
    .hidden { display: none !important; }
    .msg-box { padding: 20px; text-align: center; color: var(--text-muted); }
    .loading { padding: 20px; text-align: center; color: var(--text-muted); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 22px; border-radius: 4px; font-size: 13px; z-index: 9999; transition: opacity 0.4s; }
    .banned-notice { background: #fee; border: 1px solid var(--danger); color: var(--danger); padding: 14px; text-align: center; border-radius: 4px; margin: 20px; }
    .admin-link { color: #fff; font-size: 11px; background: rgba(255,100,0,0.7); padding: 3px 8px; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>

<!-- ★ 헤더 -->
<div id="header">
  <div id="header-top">
    <div id="site-title" onclick="navigate('board')">
      <!-- 💡 사이트 이름 수정: 아래 텍스트를 바꾸세요 -->
      코너<span>베스트</span>
    </div>
    <div id="header-user">
      <span id="header-username" class="user-name"></span>
      <button id="btn-admin-link" class="admin-link hidden" onclick="navigate('admin')">⚙ 관리자</button>
      <button id="btn-logout" class="hidden" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div id="category-bar">
    <!-- 카테고리 탭은 JS에서 동적으로 생성됩니다 -->
  </div>
</div>

<!-- ★ 메인 컨텐츠 -->
<div id="main">

  <!-- 로그인 뷰 -->
  <div id="view-login" class="hidden">
    <div id="login-box">
      <h2>🏫 학교 커뮤니티</h2>
      <div id="login-tabs">
        <div class="login-tab active" onclick="switchLoginTab('login')">로그인</div>
        <div class="login-tab" onclick="switchLoginTab('register')">회원가입</div>
      </div>

      <!-- 로그인 -->
      <div id="login-form">
        <div class="form-row">
          <label>이메일</label>
          <input type="email" id="login-email" placeholder="이메일 입력" />
        </div>
        <div class="form-row">
          <label>비밀번호</label>
          <input type="password" id="login-pw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()" />
        </div>
        <div id="login-error"></div>
        <button class="btn btn-primary" onclick="doLogin()" style="width:100%;padding:10px;font-size:14px;margin-top:8px;">로그인</button>
      </div>

      <!-- 회원가입 -->
      <div id="register-form" class="hidden">
        <div class="form-row">
          <label>닉네임 <span style="color:#888;font-weight:normal">(2~12자, 한글/영문/숫자)</span></label>
          <input type="text" id="reg-nickname" placeholder="닉네임 입력" maxlength="12" />
        </div>
        <div class="form-row">
          <label>이메일</label>
          <input type="email" id="reg-email" placeholder="이메일 입력" />
        </div>
        <div class="form-row">
          <label>비밀번호 <span style="color:#888;font-weight:normal">(6자 이상)</span></label>
          <input type="password" id="reg-pw" placeholder="비밀번호 입력" />
        </div>
        <div id="register-error"></div>
        <button class="btn btn-accent" onclick="doRegister()" style="width:100%;padding:10px;font-size:14px;margin-top:8px;">회원가입</button>
      </div>
    </div>
  </div>

  <!-- 게시판 뷰 -->
  <div id="view-board" class="hidden">
    <div class="card">
      <div class="card-header">
        <h2 id="board-title">전체 게시판</h2>
        <div id="search-bar">
          <!-- 💡 검색 옵션 추가/제거: option 태그를 수정하세요 -->
          <select id="search-type">
            <option value="title">제목</option>
            <option value="content">내용</option>
            <option value="author">작성자</option>
          </select>
          <input type="text" id="search-input" placeholder="검색어" onkeydown="if(event.key==='Enter')doSearch()" />
          <button class="btn btn-outline" onclick="doSearch()">검색</button>
          <button class="btn btn-outline" onclick="clearSearch()">초기화</button>
        </div>
      </div>

      <table id="post-table">
        <thead>
          <tr>
            <th style="width:55px">번호</th>
            <th style="width:60px">분류</th>
            <th>제목</th>
            <th style="width:80px">작성자</th>
            <th style="width:80px">작성일</th>
            <th style="width:50px">조회</th>
          </tr>
        </thead>
        <tbody id="post-list-body">
          <tr><td colspan="6" class="loading">불러오는 중...</td></tr>
        </tbody>
      </table>

      <div id="board-actions">
        <div id="pagination"></div>
        <button class="btn btn-primary" onclick="navigate('write')">✏ 글쓰기</button>
      </div>
    </div>
  </div>

  <!-- 게시글 상세 뷰 -->
  <div id="view-post" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 목록으로</span>
    <div id="post-detail">
      <div class="post-detail-header">
        <div class="post-detail-title" id="detail-title"></div>
        <div class="post-detail-meta">
          <span>👤 <b id="detail-author"></b></span>
          <span>🗂 <span id="detail-category"></span></span>
          <span>📅 <span id="detail-date"></span></span>
          <span>👁 <span id="detail-views"></span>회</span>
        </div>
      </div>
      <div class="post-detail-body" id="detail-body"></div>
      <div class="post-detail-actions" id="detail-actions">
        <!-- 수정/삭제 버튼은 본인/관리자만 표시 -->
      </div>
    </div>

    <!-- 댓글 섹션 -->
    <div id="comment-section">
      <div class="comment-header">💬 댓글 <span id="comment-count">0</span>개</div>
      <div id="comment-list" class="comment-list"></div>
      <div class="comment-write">
        <div style="font-size:12px;color:#555;margin-bottom:6px;"><b id="comment-username"></b>으로 댓글 작성</div>
        <textarea id="comment-input" placeholder="댓글을 입력하세요. (Shift+Enter로 줄바꿈)"></textarea>
        <div class="comment-write-actions">
          <button class="btn btn-primary" onclick="submitComment()">댓글 등록</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 글쓰기/수정 뷰 -->
  <div id="view-write" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 목록으로</span>
    <div id="write-form">
      <div class="card-header" style="margin:-16px -16px 16px;">
        <h2 id="write-title">✏ 글쓰기</h2>
      </div>
      <div class="form-row">
        <label>분류</label>
        <select id="write-category">
          <!-- 카테고리 옵션은 JS에서 동적으로 생성됩니다 -->
        </select>
      </div>
      <div class="form-row">
        <label>제목</label>
        <input type="text" id="write-post-title" placeholder="제목을 입력하세요" maxlength="100" />
      </div>
      <div class="form-row">
        <label>내용</label>
        <textarea id="write-content" placeholder="내용을 입력하세요"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="navigate('board')">취소</button>
        <button class="btn btn-primary" id="btn-submit-post" onclick="submitPost()">등록</button>
      </div>
    </div>
  </div>

  <!-- 관리자 패널 뷰 -->
  <div id="view-admin" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 게시판으로</span>
    <div id="admin-panel" class="card">
      <div class="card-header">
        <h2>⚙ 관리자 패널</h2>
      </div>

      <!-- 유저 관리 -->
      <div class="admin-section">
        <h3>👤 유저 관리 (이메일로 검색)</h3>
        <div class="admin-input-row">
          <input type="text" id="admin-search-user" placeholder="이메일 또는 닉네임 입력" />
          <button class="btn btn-outline" onclick="adminSearchUser()">검색</button>
        </div>
        <div id="admin-user-result"></div>
      </div>

      <!-- 전체 유저 목록 -->
      <div class="admin-section">
        <h3>📋 전체 유저 목록</h3>
        <div id="admin-user-list"><div class="loading">불러오는 중...</div></div>
      </div>

      <!-- 공지 관리 -->
      <div class="admin-section">
        <h3>📌 공지 고정 관리</h3>
        <div style="font-size:12px;color:#777;margin-bottom:8px;">게시글 번호(ID)로 공지 고정/해제합니다.</div>
        <div class="admin-input-row">
          <input type="number" id="admin-pin-id" placeholder="게시글 ID" />
          <button class="btn btn-accent" onclick="adminPinPost(true)">고정</button>
          <button class="btn btn-outline" onclick="adminPinPost(false)">해제</button>
        </div>
        <h3 style="margin-top:12px;">🗑 게시글 삭제</h3>
        <div class="admin-input-row">
          <input type="number" id="admin-del-id" placeholder="게시글 ID" />
          <button class="btn btn-danger" onclick="adminDeletePost()">삭제</button>
        </div>
      </div>

      <!-- 밴 관리 -->
      <div class="admin-section">
        <h3>🚫 밴 관리</h3>
        <div class="admin-input-row">
          <input type="text" id="admin-ban-uid" placeholder="유저 ID (검색 후 자동 입력)" />
          <input type="text" id="admin-ban-reason" placeholder="밴 사유" style="flex:2" />
          <button class="btn btn-danger" onclick="adminBanUser()">밴</button>
          <button class="btn btn-outline" onclick="adminUnbanUser()">밴 해제</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /#main -->

<!-- 토스트 메시지 -->
<div id="toast" class="toast hidden"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ================================================================

-- 프로필 테이블
create table profiles (
  id uuid references auth.users on delete cascade primary key,
  username text unique not null,
  is_admin boolean default false,
  is_banned boolean default false,
  ban_reason text,
  created_at timestamptz default now()
);

-- 게시글 테이블
create table posts (
  id bigserial primary key,
  title text not null,
  content text not null,
  author_id uuid references profiles(id) on delete set null,
  author_name text,
  category text default '자유',
  is_pinned boolean default false,
  view_count integer default 0,
  comment_count integer default 0,
  created_at timestamptz default now()
);

-- 댓글 테이블
create table comments (
  id bigserial primary key,
  post_id bigint references posts(id) on delete cascade,
  author_id uuid references profiles(id) on delete set null,
  author_name text,
  content text not null,
  created_at timestamptz default now()
);

-- 회원가입 시 프로필 자동 생성 트리거
create or replace function handle_new_user()
returns trigger as $$
begin
  insert into profiles (id, username)
  values (new.id, coalesce(new.raw_user_meta_data->>'username', split_part(new.email, '@', 1)));
  return new;
end;
$$ language plpgsql security definer;

create trigger on_auth_user_created
  after insert on auth.users
  for each row execute function handle_new_user();

-- 댓글 수 자동 업데이트 트리거
create or replace function update_comment_count()
returns trigger as $$
begin
  if (TG_OP = 'INSERT') then
    update posts set comment_count = comment_count + 1 where id = new.post_id;
  elsif (TG_OP = 'DELETE') then
    update posts set comment_count = greatest(0, comment_count - 1) where id = old.post_id;
  end if;
  return null;
end;
$$ language plpgsql security definer;

create trigger on_comment_change
  after insert or delete on comments
  for each row execute function update_comment_count();

-- Row Level Security 활성화
alter table profiles enable row level security;
alter table posts enable row level security;
alter table comments enable row level security;

-- profiles 정책
create policy "누구나 프로필 조회" on profiles for select using (true);
create policy "본인 프로필 수정" on profiles for update using (auth.uid() = id);

-- posts 정책
create policy "로그인한 사용자 게시글 조회" on posts for select using (auth.role() = 'authenticated');
create policy "밴 안 당한 사용자 글쓰기" on posts for insert
  with check (auth.uid() in (select id from profiles where is_banned = false));
create policy "본인 또는 관리자 글 수정" on posts for update
  using (auth.uid() = author_id or auth.uid() in (select id from profiles where is_admin = true));
create policy "본인 또는 관리자 글 삭제" on posts for delete
  using (auth.uid() = author_id or auth.uid() in (select id from profiles where is_admin = true));

-- comments 정책
create policy "로그인한 사용자 댓글 조회" on comments for select using (auth.role() = 'authenticated');
create policy "밴 안 당한 사용자 댓글 쓰기" on comments for insert
  with check (auth.uid() in (select id from profiles where is_banned = false));
create policy "본인 또는 관리자 댓글 삭제" on comments for delete
  using (auth.uid() = author_id or auth.uid() in (select id from profiles where is_admin = true));

================================================================ */

/* ================================================================
   앱 초기화
================================================================ */
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentProfile = null;
let currentView = null;
let currentCategory = '전체';
let currentPage = 1;
let currentPostId = null;
let editingPostId = null;
let searchQuery = null;
let searchType = 'title';

document.title = SITE_NAME;

// ── 초기화
async function init() {
  buildCategoryBar();
  buildWriteCategories();

  const { data: { session } } = await db.auth.getSession();
  if (session) {
    currentUser = session.user;
    await loadProfile();
  }

  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN') {
      currentUser = session.user;
      await loadProfile();
      navigate('board');
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      currentProfile = null;
      updateHeader();
      navigate('login');
    }
  });

  if (!currentUser) navigate('login');
  else navigate('board');
}

// ── 프로필 로드
async function loadProfile() {
  const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
  updateHeader();
}

// ── 헤더 업데이트
function updateHeader() {
  const nameEl = document.getElementById('header-username');
  const logoutBtn = document.getElementById('btn-logout');
  const adminBtn = document.getElementById('btn-admin-link');

  if (currentProfile) {
    nameEl.textContent = currentProfile.username + '님';
    logoutBtn.classList.remove('hidden');
    if (currentProfile.is_admin || SUPER_ADMINS.includes(currentUser?.email)) {
      adminBtn.classList.remove('hidden');
    } else {
      adminBtn.classList.add('hidden');
    }
  } else {
    nameEl.textContent = '';
    logoutBtn.classList.add('hidden');
    adminBtn.classList.add('hidden');
  }
}

// ── 카테고리 탭 생성
function buildCategoryBar() {
  const bar = document.getElementById('category-bar');
  bar.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (cat === currentCategory ? ' active' : '');
    tab.textContent = cat;
    tab.onclick = () => {
      currentCategory = cat;
      currentPage = 1;
      searchQuery = null;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('board-title').textContent = cat + ' 게시판';
      loadPosts();
    };
    bar.appendChild(tab);
  });
}

// ── 글쓰기 카테고리 옵션 생성 (전체 제외)
function buildWriteCategories() {
  const sel = document.getElementById('write-category');
  sel.innerHTML = '';
  CATEGORIES.filter(c => c !== '전체').forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    sel.appendChild(opt);
  });
}

/* ================================================================
   라우터 (뷰 전환)
================================================================ */
function navigate(view, params = {}) {
  // 로그인 체크
  if (view !== 'login' && !currentUser) { navigate('login'); return; }
  // 밴 체크
  if (view !== 'login' && currentProfile?.is_banned) {
    showBannedNotice(); return;
  }

  ['login','board','post','write','admin'].forEach(v => {
    document.getElementById('view-' + v).classList.add('hidden');
  });

  currentView = view;
  document.getElementById('view-' + view).classList.remove('hidden');

  if (view === 'board') loadPosts();
  if (view === 'post' && params.postId) {
    currentPostId = params.postId;
    loadPostDetail(params.postId);
  }
  if (view === 'write') {
    editingPostId = params.editId || null;
    if (editingPostId) loadEditPost(editingPostId);
    else resetWriteForm();
  }
  if (view === 'admin') loadAdminPanel();
  window.scrollTo(0, 0);
}

function showBannedNotice() {
  ['login','board','post','write','admin'].forEach(v => {
    document.getElementById('view-' + v).classList.add('hidden');
  });
  document.getElementById('main').innerHTML = `
    <div class="banned-notice">
      <h2 style="margin-bottom:8px;">⛔ 이용 제한 계정</h2>
      <p>관리자에 의해 이용이 제한된 계정입니다.</p>
      <p style="margin-top:6px;font-size:12px;color:#999;">사유: ${currentProfile?.ban_reason || '사유 없음'}</p>
      <button class="btn btn-outline" style="margin-top:14px;" onclick="logout()">로그아웃</button>
    </div>`;
}

/* ================================================================
   인증 (로그인/회원가입/로그아웃)
================================================================ */
function switchLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
  document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
  document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
  document.getElementById('login-error').textContent = '';
  document.getElementById('register-error').textContent = '';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!email || !pw) { document.getElementById('login-error').textContent = '이메일과 비밀번호를 입력하세요.'; return; }

  const { error } = await db.auth.signInWithPassword({ email, password: pw });
  if (error) {
    // 💡 에러 메시지 커스터마이징: 아래 텍스트를 수정하세요
    document.getElementById('login-error').textContent = '로그인 실패: 이메일/비밀번호를 확인하세요.';
  }
}

async function doRegister() {
  const nickname = document.getElementById('reg-nickname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pw = document.getElementById('reg-pw').value;
  const errEl = document.getElementById('register-error');

  if (!nickname || nickname.length < 2) { errEl.textContent = '닉네임을 2자 이상 입력하세요.'; return; }
  if (!/^[가-힣a-zA-Z0-9]+$/.test(nickname)) { errEl.textContent = '닉네임은 한글, 영문, 숫자만 가능합니다.'; return; }
  if (!email) { errEl.textContent = '이메일을 입력하세요.'; return; }
  if (pw.length < 6) { errEl.textContent = '비밀번호를 6자 이상 입력하세요.'; return; }

  // 닉네임 중복 체크
  const { data: existing } = await db.from('profiles').select('id').eq('username', nickname).single();
  if (existing) { errEl.textContent = '이미 사용 중인 닉네임입니다.'; return; }

  const { error } = await db.auth.signUp({
    email, password: pw,
    options: { data: { username: nickname } }
  });
  if (error) { errEl.textContent = '가입 실패: ' + error.message; return; }
  showToast('가입 완료! 이메일 인증 후 로그인하세요. (인증 비활성화 시 바로 로그인 가능)');
  switchLoginTab('login');
}

async function logout() {
  await db.auth.signOut();
}

/* ================================================================
   게시글 목록
================================================================ */
async function loadPosts() {
  const tbody = document.getElementById('post-list-body');
  tbody.innerHTML = '<tr><td colspan="6" class="loading">불러오는 중...</td></tr>';

  let query = db.from('posts').select('id,title,author_name,category,is_pinned,view_count,comment_count,created_at', { count: 'exact' });

  // 카테고리 필터
  if (currentCategory !== '전체') query = query.eq('category', currentCategory);

  // 검색 필터
  if (searchQuery) {
    if (searchType === 'title') query = query.ilike('title', `%${searchQuery}%`);
    else if (searchType === 'content') query = query.ilike('content', `%${searchQuery}%`);
    else if (searchType === 'author') query = query.ilike('author_name', `%${searchQuery}%`);
  }

  // 공지/고정 먼저, 그 다음 최신순
  query = query.order('is_pinned', { ascending: false }).order('created_at', { ascending: false });

  // 페이징
  const from = (currentPage - 1) * PAGE_SIZE;
  query = query.range(from, from + PAGE_SIZE - 1);

  const { data: posts, count, error } = await query;

  if (error) { tbody.innerHTML = '<tr><td colspan="6" class="msg-box">오류가 발생했습니다.</td></tr>'; return; }
  if (!posts || posts.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="msg-box">게시글이 없습니다.</td></tr>'; return; }

  tbody.innerHTML = '';
  posts.forEach((post, idx) => {
    const isNew = (Date.now() - new Date(post.created_at).getTime()) < 3600000; // 1시간 이내
    const tr = document.createElement('tr');
    tr.className = 'post-row' + (post.is_pinned ? ' notice pinned' : '');
    tr.innerHTML = `
      <td class="post-num">${post.is_pinned ? '📌' : (count - from - idx)}</td>
      <td class="post-cat"><span>${post.category}</span></td>
      <td class="post-title-cell">
        ${post.is_pinned ? '<span class="pin-badge">공지</span>' : ''}
        <a class="post-title-link" href="#" onclick="navigate('post',{postId:${post.id}});return false;">
          ${escHtml(post.title)}
          ${post.comment_count > 0 ? `<span class="comment-count">[${post.comment_count}]</span>` : ''}
          ${isNew ? '<span class="new-badge">N</span>' : ''}
        </a>
      </td>
      <td class="post-author">${escHtml(post.author_name || '(탈퇴)')}</td>
      <td class="post-date">${formatDate(post.created_at)}</td>
      <td class="post-views">${post.view_count}</td>`;
    tbody.appendChild(tr);
  });

  buildPagination(count);
}

function buildPagination(total) {
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages <= 1) return;

  // 최대 10개 페이지 버튼 표시
  const start = Math.max(1, currentPage - 4);
  const end = Math.min(totalPages, start + 9);

  if (currentPage > 1) {
    const btn = document.createElement('button');
    btn.className = 'page-btn'; btn.textContent = '◀';
    btn.onclick = () => { currentPage--; loadPosts(); };
    pg.appendChild(btn);
  }
  for (let i = start; i <= end; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    const page = i;
    btn.onclick = () => { currentPage = page; loadPosts(); };
    pg.appendChild(btn);
  }
  if (currentPage < totalPages) {
    const btn = document.createElement('button');
    btn.className = 'page-btn'; btn.textContent = '▶';
    btn.onclick = () => { currentPage++; loadPosts(); };
    pg.appendChild(btn);
  }
}

function doSearch() {
  searchQuery = document.getElementById('search-input').value.trim() || null;
  searchType = document.getElementById('search-type').value;
  currentPage = 1;
  loadPosts();
}

function clearSearch() {
  searchQuery = null;
  document.getElementById('search-input').value = '';
  currentPage = 1;
  loadPosts();
}

/* ================================================================
   게시글 상세
================================================================ */
async function loadPostDetail(postId) {
  document.getElementById('detail-title').textContent = '불러오는 중...';
  document.getElementById('detail-body').textContent = '';

  // 조회수 증가
  try {
    await db.rpc('increment_view', { post_id: postId });
  } catch(e) {
    await db.from('posts').update({ view_count: (post?.view_count || 0) + 1 }).eq('id', postId);
  }

  const { data: post } = await db.from('posts').select('*').eq('id', postId).single();
  if (!post) { navigate('board'); return; }

  document.getElementById('detail-title').textContent = post.title;
  document.getElementById('detail-author').textContent = post.author_name || '(탈퇴)';
  document.getElementById('detail-category').textContent = post.category;
  document.getElementById('detail-date').textContent = formatDateFull(post.created_at);
  document.getElementById('detail-views').textContent = (post.view_count || 0) + 1;
  document.getElementById('detail-body').textContent = post.content;

  // 수정/삭제 버튼 (본인 또는 관리자)
  const actionsEl = document.getElementById('detail-actions');
  actionsEl.innerHTML = '';
  const isOwner = currentUser && post.author_id === currentUser.id;
  const isAdmin = currentProfile?.is_admin || SUPER_ADMINS.includes(currentUser?.email);

  if (isOwner) {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-outline';
    editBtn.textContent = '수정';
    editBtn.onclick = () => navigate('write', { editId: post.id });
    actionsEl.appendChild(editBtn);
  }
  if (isOwner || isAdmin) {
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger';
    delBtn.textContent = '삭제';
    delBtn.onclick = () => deletePost(post.id);
    actionsEl.appendChild(delBtn);
  }
  if (isAdmin && !post.is_pinned) {
    const pinBtn = document.createElement('button');
    pinBtn.className = 'btn btn-accent';
    pinBtn.textContent = '📌 공지 고정';
    pinBtn.onclick = () => togglePin(post.id, true);
    actionsEl.appendChild(pinBtn);
  }
  if (isAdmin && post.is_pinned) {
    const unpinBtn = document.createElement('button');
    unpinBtn.className = 'btn btn-outline';
    unpinBtn.textContent = '고정 해제';
    unpinBtn.onclick = () => togglePin(post.id, false);
    actionsEl.appendChild(unpinBtn);
  }
  if (isAdmin) {
    const banBtn = document.createElement('button');
    banBtn.className = 'btn btn-danger';
    banBtn.textContent = '작성자 밴';
    banBtn.onclick = () => {
      const reason = prompt('밴 사유를 입력하세요:');
      if (reason) quickBanUser(post.author_id, reason);
    };
    actionsEl.appendChild(banBtn);
  }

  document.getElementById('comment-username').textContent = currentProfile?.username || '';
  loadComments(postId);
}

async function deletePost(postId) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  const { error } = await db.from('posts').delete().eq('id', postId);
  if (!error) { showToast('삭제되었습니다.'); navigate('board'); }
  else showToast('삭제 실패: ' + error.message);
}

async function togglePin(postId, pin) {
  const { error } = await db.from('posts').update({ is_pinned: pin }).eq('id', postId);
  if (!error) { showToast(pin ? '공지로 고정되었습니다.' : '고정 해제되었습니다.'); loadPostDetail(postId); }
}

/* ================================================================
   댓글
================================================================ */
async function loadComments(postId) {
  const { data: comments } = await db.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
  const listEl = document.getElementById('comment-list');
  const countEl = document.getElementById('comment-count');
  countEl.textContent = comments?.length || 0;

  if (!comments || comments.length === 0) {
    listEl.innerHTML = '<div class="no-comments">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</div>';
    return;
  }

  listEl.innerHTML = '';
  const isAdmin = currentProfile?.is_admin || SUPER_ADMINS.includes(currentUser?.email);

  comments.forEach(c => {
    const div = document.createElement('div');
    div.className = 'comment-item';
    const canDelete = (currentUser && c.author_id === currentUser.id) || isAdmin;
    div.innerHTML = `
      <div class="comment-meta">
        <span class="comment-author">${escHtml(c.author_name || '(탈퇴)')}</span>
        <span>${formatDateFull(c.created_at)}</span>
        ${canDelete ? `<span class="comment-delete" onclick="deleteComment(${c.id}, ${postId})">삭제</span>` : ''}
        ${isAdmin ? `<span class="comment-delete" onclick="quickBanUser('${c.author_id}', '댓글 규정 위반')">작성자 밴</span>` : ''}
      </div>
      <div class="comment-body">${escHtml(c.content)}</div>`;
    listEl.appendChild(div);
  });
}

async function submitComment() {
  const input = document.getElementById('comment-input');
  const content = input.value.trim();
  if (!content) { showToast('댓글 내용을 입력하세요.'); return; }
  if (!currentPostId) return;

  const { error } = await db.from('comments').insert({
    post_id: currentPostId,
    author_id: currentUser.id,
    author_name: currentProfile.username,
    content
  });
  if (!error) { input.value = ''; loadComments(currentPostId); showToast('댓글이 등록되었습니다.'); }
  else showToast('댓글 등록 실패: ' + error.message);
}

async function deleteComment(commentId, postId) {
  if (!confirm('댓글을 삭제하시겠습니까?')) return;
  const { error } = await db.from('comments').delete().eq('id', commentId);
  if (!error) { loadComments(postId); showToast('댓글이 삭제되었습니다.'); }
}

/* ================================================================
   글쓰기 / 수정
================================================================ */
function resetWriteForm() {
  document.getElementById('write-title').textContent = '✏ 글쓰기';
  document.getElementById('btn-submit-post').textContent = '등록';
  document.getElementById('write-post-title').value = '';
  document.getElementById('write-content').value = '';
  editingPostId = null;
}

async function loadEditPost(postId) {
  const { data: post } = await db.from('posts').select('*').eq('id', postId).single();
  if (!post) return;
  document.getElementById('write-title').textContent = '✏ 글 수정';
  document.getElementById('btn-submit-post').textContent = '수정 완료';
  document.getElementById('write-post-title').value = post.title;
  document.getElementById('write-content').value = post.content;
  document.getElementById('write-category').value = post.category;
}

async function submitPost() {
  const title = document.getElementById('write-post-title').value.trim();
  const content = document.getElementById('write-content').value.trim();
  const category = document.getElementById('write-category').value;

  if (!title) { showToast('제목을 입력하세요.'); return; }
  if (title.length > 100) { showToast('제목은 100자 이내로 입력하세요.'); return; }
  if (!content) { showToast('내용을 입력하세요.'); return; }

  if (editingPostId) {
    // 수정 모드
    const { error } = await db.from('posts').update({ title, content, category }).eq('id', editingPostId);
    if (!error) { showToast('수정되었습니다.'); navigate('post', { postId: editingPostId }); }
    else showToast('수정 실패: ' + error.message);
  } else {
    // 새 글 작성
    const { data, error } = await db.from('posts').insert({
      title, content, category,
      author_id: currentUser.id,
      author_name: currentProfile.username
    }).select().single();
    if (!error && data) { showToast('글이 등록되었습니다.'); navigate('post', { postId: data.id }); }
    else showToast('등록 실패: ' + error?.message);
  }
}

/* ================================================================
   관리자 패널
================================================================ */
async function loadAdminPanel() {
  if (!currentProfile?.is_admin && !SUPER_ADMINS.includes(currentUser?.email)) {
    navigate('board'); return;
  }
  await loadAdminUserList();
}

async function loadAdminUserList() {
  const { data: users } = await db.from('profiles').select('*').order('created_at', { ascending: false }).limit(50);
  const el = document.getElementById('admin-user-list');
  if (!users) { el.innerHTML = '<div class="msg-box">불러오기 실패</div>'; return; }

  el.innerHTML = '';
  users.forEach(u => {
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <span class="uname">${escHtml(u.username)}</span>
      <span style="color:#999;font-size:11px">${u.id.substring(0,8)}...</span>
      ${u.is_admin ? '<span class="admin-badge">관리자</span>' : ''}
      ${u.is_banned ? `<span class="banned-badge">밴 (${escHtml(u.ban_reason||'')})</span>` : ''}
      <button class="btn btn-outline" style="font-size:11px;padding:3px 8px;" onclick="prefillBan('${u.id}','${escHtml(u.username)}')">
        ${u.is_banned ? '밴 해제' : '밴'}
      </button>
      <button class="btn btn-outline" style="font-size:11px;padding:3px 8px;" onclick="toggleAdmin('${u.id}', ${!u.is_admin})">
        ${u.is_admin ? '관리자 해제' : '관리자 지정'}
      </button>`;
    el.appendChild(row);
  });
}

function prefillBan(uid, username) {
  document.getElementById('admin-ban-uid').value = uid;
  document.getElementById('admin-ban-reason').focus();
  showToast(username + ' 선택됨. 사유 입력 후 밴/해제 버튼을 클릭하세요.');
}

async function adminSearchUser() {
  const q = document.getElementById('admin-search-user').value.trim();
  if (!q) return;
  const { data } = await db.from('profiles').select('*').or(`username.ilike.%${q}%`).limit(5);
  const el = document.getElementById('admin-user-result');
  if (!data || data.length === 0) { el.innerHTML = '<div style="font-size:12px;color:#999;padding:6px;">검색 결과 없음</div>'; return; }
  el.innerHTML = '';
  data.forEach(u => {
    const row = document.createElement('div');
    row.className = 'user-row';
    row.innerHTML = `
      <span class="uname">${escHtml(u.username)}</span>
      <span style="color:#999;font-size:11px">${u.id}</span>
      ${u.is_banned ? '<span class="banned-badge">밴됨</span>' : ''}
      <button class="btn btn-outline" style="font-size:11px;padding:3px 8px;" onclick="prefillBan('${u.id}','${escHtml(u.username)}')">선택</button>`;
    el.appendChild(row);
  });
}

async function adminBanUser() {
  const uid = document.getElementById('admin-ban-uid').value.trim();
  const reason = document.getElementById('admin-ban-reason').value.trim();
  if (!uid) { showToast('유저 ID를 입력하세요.'); return; }
  if (!reason) { showToast('밴 사유를 입력하세요.'); return; }
  if (!confirm(`이 유저를 밴하시겠습니까?\n사유: ${reason}`)) return;

  const { error } = await db.rpc('admin_ban_user', { target_id: uid, reason: reason, ban: true });
  if (!error) { showToast('밴 완료.'); loadAdminUserList(); }
  else showToast('실패: ' + error.message);
}

async function adminUnbanUser() {
  const uid = document.getElementById('admin-ban-uid').value.trim();
  if (!uid) { showToast('유저 ID를 입력하세요.'); return; }
  if (!confirm('이 유저의 밴을 해제하시겠습니까?')) return;

  const { error } = await db.rpc('admin_ban_user', { target_id: uid, reason: '', ban: false });
  if (!error) { showToast('밴 해제 완료.'); loadAdminUserList(); }
  else showToast('실패: ' + error.message);
}

async function quickBanUser(uid, reason) {
  if (!uid || uid === currentUser.id) { showToast('본인은 밴할 수 없습니다.'); return; }
  if (!confirm(`이 유저를 밴하시겠습니까?\n사유: ${reason}`)) return;
  const { error } = await db.rpc('admin_ban_user', { target_id: uid, reason: reason, ban: true });
  if (!error) showToast('밴 완료.'); else showToast('실패: ' + error.message);
}

async function adminPinPost(pin) {
  const id = document.getElementById('admin-pin-id').value;
  if (!id) { showToast('게시글 ID를 입력하세요.'); return; }
  const { error } = await db.from('posts').update({ is_pinned: pin }).eq('id', id);
  if (!error) showToast(pin ? '공지로 고정되었습니다.' : '고정이 해제되었습니다.');
  else showToast('실패: ' + error.message);
}

async function adminDeletePost() {
  const id = document.getElementById('admin-del-id').value;
  if (!id) { showToast('게시글 ID를 입력하세요.'); return; }
  if (!confirm('게시글을 삭제하시겠습니까?')) return;
  const { error } = await db.from('posts').delete().eq('id', id);
  if (!error) showToast('삭제 완료.'); else showToast('실패: ' + error.message);
}

async function toggleAdmin(uid, makeAdmin) {
  if (!confirm(makeAdmin ? '관리자로 지정하시겠습니까?' : '관리자를 해제하시겠습니까?')) return;
  const { error } = await db.from('profiles').update({ is_admin: makeAdmin }).eq('id', uid);
  if (!error) { showToast(makeAdmin ? '관리자로 지정되었습니다.' : '관리자 해제되었습니다.'); loadAdminUserList(); }
  else showToast('실패: ' + error.message);
}

/* ================================================================
   유틸리티
================================================================ */
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  return (d.getMonth()+1).toString().padStart(2,'0') + '.' + d.getDate().toString().padStart(2,'0');
}

function formatDateFull(dateStr) {
  const d = new Date(dateStr);
  return d.getFullYear() + '.' +
    (d.getMonth()+1).toString().padStart(2,'0') + '.' +
    d.getDate().toString().padStart(2,'0') + ' ' +
    d.getHours().toString().padStart(2,'0') + ':' +
    d.getMinutes().toString().padStart(2,'0');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2500);
}

// ── 시작
init();

window.navigate = navigate;
window.logout = logout;

window.doLogin = doLogin;
window.doRegister = doRegister;
window.doSearch = doSearch;
window.clearSearch = clearSearch;
window.submitComment = submitComment;
window.deleteComment = deleteComment;
window.submitPost = submitPost;
window.adminSearchUser = adminSearchUser;
window.adminPinPost = adminPinPost;
window.adminDeletePost = adminDeletePost;
window.adminBanUser = adminBanUser;
window.adminUnbanUser = adminUnbanUser;
window.prefillBan = prefillBan;
window.toggleAdmin = toggleAdmin;
window.quickBanUser = quickBanUser;
window.togglePin = togglePin;
window.deletePost = deletePost;
</script>
