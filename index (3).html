<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 🛡️ 보안 오류 해결: CSP 설정 추가 -->
  <!-- 스크립트 실행 허용 범위와 Supabase 연결을 안전하게 정의합니다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://esm.sh https://*.supabase.co; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  
  <title>CCAS DC - 학교 커뮤니티</title>
  <style>
    /* =====================================================
       🎨 디자인 시스템
    ===================================================== */
    :root {
      --primary: #1a3f7a; --primary-dark: #122d58;
      --accent: #e05c00; --bg: #e8e8e8; --surface: #fff;
      --border: #c0c0c0; --border-light: #e0e0e0;
      --text: #222; --text-muted: #777;
      --notice-bg: #fff8e1; --danger: #cc2222; --reply-bg: #f5f8ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Malgun Gothic','맑은 고딕',Dotum,sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
    a{color:inherit;text-decoration:none} a:hover{color:var(--accent)}
    button{cursor:pointer;font-family:inherit;font-size:12px}
    input,textarea,select{font-family:inherit;font-size:13px}

    /* 헤더 */
    #header{background:var(--primary);color:#fff;border-bottom:3px solid var(--accent)}
    #header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    #site-title{font-size:20px;font-weight:900;color:#fff;cursor:pointer}
    #site-title span{color:var(--accent)}
    #header-user{display:flex;align-items:center;gap:8px;font-size:12px}
    #header-user button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:3px}
    #header-user button:hover{background:rgba(255,255,255,.25)}

    /* 카테고리 탭 */
    #category-bar{background:var(--primary-dark);display:flex;align-items:center;padding:0 16px;overflow-x:auto}
    .cat-tab{padding:8px 14px;color:rgba(255,255,255,.7);cursor:pointer;font-size:12px;border-bottom:3px solid transparent;white-space:nowrap}
    .cat-tab:hover{color:#fff} .cat-tab.active{color:#fff;border-bottom-color:var(--accent);font-weight:bold}

    /* 레이아웃 */
    #main{max-width:980px;margin:14px auto;padding:0 8px}
    .card{background:var(--surface);border:1px solid var(--border)}
    .card-header{background:#f5f5f5;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
    .card-header h2{font-size:14px;font-weight:bold}

    /* 게시글 목록 */
    #post-table{width:100%;border-collapse:collapse}
    #post-table th{background:#f0f0f0;border:1px solid var(--border);padding:6px 8px;text-align:center;font-size:12px;color:#555;font-weight:bold}
    #post-table td{border:1px solid var(--border-light);padding:6px 8px}
    #post-table tr:hover td{background:#f9f9ff}
    .post-num{text-align:center;color:var(--text-muted);width:55px}
    .post-cat{text-align:center;width:60px}
    .post-cat span{background:var(--primary);color:#fff;padding:2px 6px;border-radius:2px;font-size:11px}
    .post-title-link{color:#1a1a1a;font-size:13px}
    .post-title-link:hover{color:var(--primary)}
    .post-title-link .comment-count{color:var(--accent);font-size:11px;margin-left:4px}
    .post-author{text-align:center;width:90px;color:var(--text-muted)}
    .post-date{text-align:center;width:80px;color:var(--text-muted);font-size:11px}
    .post-views{text-align:center;width:45px;color:var(--text-muted);font-size:11px}
    .post-votes-col{text-align:center;width:55px;font-size:11px}
    .post-row.notice td{background:var(--notice-bg)}
    .post-row.pinned .post-title-link{font-weight:bold}
    .pin-badge{background:var(--accent);color:#fff;font-size:10px;padding:1px 5px;border-radius:2px;margin-right:5px}
    .new-badge{color:var(--danger);font-size:11px;margin-left:3px;font-weight:bold}
    .upvote-text{color:#c00}

    /* 관리자 뱃지 */
    .name-juddak{color:#ff6b00 !important;font-weight:bold}
    .name-paddak{color:#0066cc !important;font-weight:bold}
    .badge-juddak{background:#ff6b00;color:#fff;font-size:9px;padding:1px 4px;border-radius:2px;margin-left:3px;vertical-align:middle}
    .badge-paddak{background:#0066cc;color:#fff;font-size:9px;padding:1px 4px;border-radius:2px;margin-left:3px;vertical-align:middle}

    /* 페이징 */
    #pagination{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:12px}
    .page-btn{border:1px solid var(--border);background:var(--surface);padding:5px 9px;color:var(--text);border-radius:2px;min-width:30px;text-align:center}
    .page-btn:hover{background:#eef;border-color:var(--primary);color:var(--primary)}
    .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* 버튼 스타일 */
    #board-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    .btn{border:none;padding:6px 14px;border-radius:3px;font-size:12px;font-weight:bold}
    .btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:var(--primary-dark)}
    .btn-accent{background:var(--accent);color:#fff} .btn-accent:hover{background:#c45000}
    .btn-danger{background:var(--danger);color:#fff} .btn-danger:hover{background:#aa1111}
    .btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)} .btn-outline:hover{background:#f0f0f0}
    .btn-sm{padding:3px 8px;font-size:11px}

    /* 검색 바 */
    #search-bar{display:flex;gap:4px}
    #search-bar input{border:1px solid var(--border);padding:5px 8px;width:180px}
    #search-bar select{border:1px solid var(--border);padding:5px}

    /* 게시글 상세 */
    #post-detail{background:var(--surface);border:1px solid var(--border)}
    .post-detail-header{padding:12px 14px;border-bottom:1px solid var(--border-light)}
    .post-detail-title{font-size:17px;font-weight:bold;margin-bottom:8px}
    .post-detail-meta{font-size:12px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap}
    .post-detail-body{padding:16px 14px;min-height:200px;line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-all}
    .post-detail-actions{padding:8px 14px;border-top:1px solid var(--border-light);display:flex;gap:6px;justify-content:center}
    .back-btn{color:var(--primary);font-size:12px;cursor:pointer;margin-bottom:8px;display:inline-block}
    .back-btn:hover{text-decoration:underline}

    /* 투표 섹션 */
    .vote-section{display:flex;justify-content:center;gap:16px;padding:14px;border-top:1px solid var(--border-light)}
    .vote-btn{display:flex;align-items:center;gap:6px;padding:8px 24px;border-radius:4px;font-size:14px;font-weight:bold;border:2px solid var(--border);background:var(--surface);transition:.2s}
    .vote-btn.up:hover,.vote-btn.up.active{background:#fff0f0;border-color:#cc2222;color:#cc2222}
    .vote-btn.down:hover,.vote-btn.down.active{background:#f0f0ff;border-color:#2244cc;color:#2244cc}

    /* 댓글 섹션 */
    #comment-section{margin-top:14px;background:var(--surface);border:1px solid var(--border)}
    .comment-header{background:#f0f0f0;border-bottom:1px solid var(--border);padding:7px 12px;font-weight:bold;font-size:13px}
    .comment-item{border-bottom:1px solid var(--border-light);padding:10px 14px}
    .comment-item:last-child{border-bottom:none}
    .comment-meta{font-size:11px;color:var(--text-muted);margin-bottom:5px;display:flex;gap:8px;align-items:center}
    .comment-author{font-weight:bold;color:var(--text)}
    .comment-body{font-size:13px;line-height:1.6;white-space:pre-wrap}
    .comment-actions{margin-top:5px;display:flex;gap:8px}
    .comment-action-btn{color:#888;font-size:11px;cursor:pointer;background:none;border:none;padding:0}
    .comment-action-btn:hover{color:var(--accent);text-decoration:underline}
    .comment-delete-btn{color:var(--danger) !important}

    /* 대댓글 */
    .replies{margin-top:6px;margin-left:20px;border-left:2px solid var(--border-light);padding-left:10px}
    .reply-item{padding:8px 10px;background:var(--reply-bg);border-bottom:1px solid var(--border-light);border-radius:2px;margin-bottom:4px}
    .reply-form{margin-top:8px;margin-left:20px;background:#f8f8f8;border:1px solid var(--border);padding:8px;border-radius:3px}
    .comment-write{padding:12px 14px;border-top:1px solid var(--border);background:#fafafa}
    .comment-write textarea{width:100%;border:1px solid var(--border);padding:8px;resize:vertical;min-height:70px;border-radius:2px}

    /* 유틸리티 */
    .hidden{display:none !important}
    .loading{padding:20px;text-align:center;color:var(--text-muted)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:4px;font-size:13px;z-index:9999}
    .banned-notice{background:#fee;border:1px solid var(--danger);color:var(--danger);padding:14px;text-align:center;border-radius:4px;margin:20px}
  </style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div id="site-title" onclick="navigate('board')">CCAS<span> DC</span></div>
    <div id="header-user">
      <span id="header-username"></span>
      <button id="btn-admin-link" class="admin-link hidden" onclick="navigate('admin')">⚙ 관리자</button>
      <button id="btn-logout" class="hidden" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div id="category-bar"></div>
</div>

<div id="main">
  <!-- 로그인 뷰 -->
  <div id="view-login" class="hidden">
    <div id="login-box" style="max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--border);padding:30px">
      <h2 style="text-align:center;margin-bottom:20px;color:var(--primary)">🏫 CCAS DC</h2>
      <div id="login-tabs" style="display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)">
        <div class="login-tab active" onclick="switchLoginTab('login')" style="flex:1;text-align:center;padding:8px;cursor:pointer">로그인</div>
        <div class="login-tab" onclick="switchLoginTab('register')" style="flex:1;text-align:center;padding:8px;cursor:pointer">회원가입</div>
      </div>
      <div id="login-form">
        <input type="email" id="login-email" placeholder="이메일" style="width:100%;margin-bottom:10px;padding:8px">
        <input type="password" id="login-pw" placeholder="비밀번호" style="width:100%;margin-bottom:10px;padding:8px" onkeydown="if(event.key==='Enter')doLogin()">
        <div id="login-error" style="color:var(--danger);font-size:12px;margin-bottom:10px"></div>
        <button class="btn btn-primary" onclick="doLogin()" style="width:100%;padding:10px">로그인</button>
      </div>
      <div id="register-form" class="hidden">
        <input type="text" id="reg-nickname" placeholder="닉네임 (2-12자)" style="width:100%;margin-bottom:10px;padding:8px">
        <input type="email" id="reg-email" placeholder="이메일" style="width:100%;margin-bottom:10px;padding:8px">
        <input type="password" id="reg-pw" placeholder="비밀번호 (6자 이상)" style="width:100%;margin-bottom:10px;padding:8px">
        <div id="register-error" style="color:var(--danger);font-size:12px;margin-bottom:10px"></div>
        <button class="btn btn-accent" onclick="doRegister()" style="width:100%;padding:10px">회원가입</button>
      </div>
    </div>
  </div>

  <!-- 게시판 뷰 -->
  <div id="view-board" class="hidden">
    <div class="card">
      <div class="card-header">
        <h2 id="board-title">전체 게시판</h2>
        <div id="search-bar">
          <select id="search-type"><option value="title">제목</option><option value="content">내용</option><option value="author">작성자</option></select>
          <input type="text" id="search-input" placeholder="검색어" onkeydown="if(event.key==='Enter')doSearch()">
          <button class="btn btn-outline" onclick="doSearch()">검색</button>
        </div>
      </div>
      <table id="post-table">
        <thead>
          <tr>
            <th style="width:55px">번호</th>
            <th style="width:60px">분류</th>
            <th>제목</th>
            <th style="width:90px">작성자</th>
            <th style="width:80px">작성일</th>
            <th style="width:45px">조회</th>
            <th style="width:55px">개추</th>
          </tr>
        </thead>
        <tbody id="post-list-body"></tbody>
      </table>
      <div id="board-actions">
        <div id="pagination"></div>
        <button class="btn btn-primary" onclick="navigate('write')">✏ 글쓰기</button>
      </div>
    </div>
  </div>

  <!-- 게시글 상세 뷰 -->
  <div id="view-post" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 목록으로</span>
    <div id="post-detail">
      <div class="post-detail-header">
        <div class="post-detail-title" id="detail-title"></div>
        <div class="post-detail-meta">
          <span>👤 <b id="detail-author"></b></span>
          <span>🗂 <span id="detail-category"></span></span>
          <span>📅 <span id="detail-date"></span></span>
          <span>👁 <span id="detail-views"></span>회</span>
        </div>
      </div>
      <div class="post-detail-body" id="detail-body"></div>
      <div class="vote-section">
        <button class="vote-btn up" id="btn-upvote" onclick="votePost('up')">👍 개추 <span id="upvote-count">0</span></button>
        <button class="vote-btn down" id="btn-downvote" onclick="votePost('down')">👎 비추 <span id="downvote-count">0</span></button>
      </div>
      <div class="post-detail-actions" id="detail-actions"></div>
    </div>
    <div id="comment-section">
      <div class="comment-header">💬 댓글 <span id="comment-count">0</span>개</div>
      <div id="comment-list"></div>
      <div class="comment-write">
        <textarea id="comment-input" placeholder="댓글을 입력하세요"></textarea>
        <div style="display:flex;justify-content:flex-end;margin-top:6px">
          <button class="btn btn-primary" onclick="submitComment()">댓글 등록</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 글쓰기 뷰 -->
  <div id="view-write" class="hidden">
    <div class="card" style="padding:16px">
      <h2 id="write-title" style="margin-bottom:16px">✏ 글쓰기</h2>
      <select id="write-category" style="width:100%;margin-bottom:10px;padding:8px"></select>
      <input type="text" id="write-post-title" placeholder="제목" style="width:100%;margin-bottom:10px;padding:8px">
      <textarea id="write-content" placeholder="내용을 입력하세요" style="width:100%;min-height:300px;margin-bottom:10px;padding:8px"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-outline" onclick="navigate('board')">취소</button>
        <button class="btn btn-primary" id="btn-submit-post" onclick="submitPost()">등록</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- 🧪 메인 로직 스크립트 -->
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://mlcnmfqtqthehlrcnftb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sY25tZnF0cXRoZWhscmNuZnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTE2ODQsImV4cCI6MjA5NTQ4NzY4NH0.VDwO5AtwzDTcCrgnguDgKd_X85uE6T5rt-JOFj4EWXQ';

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 앱 상태 변수
let currentUser = null, currentProfile = null;
let currentCategory = '전체', currentPage = 1, currentPostId = null;
const CATEGORIES = ['전체', '자유', '공지', '신문고', '개드립', '갈드컵', '노래추천', '잡담', '애니추천', '공부', '정보'];
const PAGE_SIZE = 30;

/* ── 초기화 ── */
async function init() {
  buildCategoryBar();
  const { data: { session } } = await db.auth.getSession();
  if (session) { currentUser = session.user; await loadProfile(); }
  
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN') { currentUser = session.user; await loadProfile(); navigate('board'); }
    else if (event === 'SIGNED_OUT') { currentUser = null; currentProfile = null; navigate('login'); }
  });
  
  if (!currentUser) navigate('login'); else navigate('board');
}

async function loadProfile() {
  const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
  updateHeader();
}

function updateHeader() {
  const nameEl = document.getElementById('header-username');
  const logoutBtn = document.getElementById('btn-logout');
  if (currentProfile) {
    const level = currentProfile.admin_level || 0;
    const badge = level >= 2 ? '<span class="badge-juddak">주딱</span>' : level >= 1 ? '<span class="badge-paddak">파딱</span>' : '';
    nameEl.innerHTML = `<b>${escHtml(currentProfile.username)}</b>${badge}님`;
    logoutBtn.classList.remove('hidden');
  } else {
    nameEl.textContent = '';
    logoutBtn.classList.add('hidden');
  }
}

/* ── 라우터 ── */
function navigate(view, params = {}) {
  ['login','board','post','write'].forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
  document.getElementById('view-'+view).classList.remove('hidden');
  
  if (view === 'board') loadPosts();
  if (view === 'post') { currentPostId = params.postId; loadPostDetail(params.postId); }
  if (view === 'write') buildWriteCategories();
  window.scrollTo(0, 0);
}

/* ── 게시글 기능 ── */
async function loadPosts() {
  const tbody = document.getElementById('post-list-body');
  tbody.innerHTML = '<tr><td colspan="7" class="loading">불러오는 중...</td></tr>';
  
  let query = db.from('posts').select('*', { count: 'exact' });
  if (currentCategory !== '전체') query = query.eq('category', currentCategory);
  
  query = query.order('is_pinned', { ascending: false }).order('created_at', { ascending: false });
  const from = (currentPage - 1) * PAGE_SIZE;
  query = query.range(from, from + PAGE_SIZE - 1);

  const { data: posts, count } = await query;
  tbody.innerHTML = '';
  
  posts?.forEach((post, idx) => {
    const tr = document.createElement('tr');
    tr.className = post.is_pinned ? 'post-row notice pinned' : 'post-row';
    tr.innerHTML = `
      <td class="post-num">${post.is_pinned ? '📌' : count - from - idx}</td>
      <td class="post-cat"><span>${escHtml(post.category)}</span></td>
      <td><a href="#" onclick="navigate('post', {postId:${post.id}});return false">${escHtml(post.title)}</a></td>
      <td class="post-author">${escHtml(post.author_name)}</td>
      <td class="post-date">${formatDate(post.created_at)}</td>
      <td class="post-views">${post.view_count || 0}</td>
      <td class="post-votes-col">${post.upvotes || 0}</td>`;
    tbody.appendChild(tr);
  });
}

/* ── 유틸리티 및 기타 ── */
function buildCategoryBar() {
  const bar = document.getElementById('category-bar');
  CATEGORIES.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'cat-tab';
    tab.textContent = cat;
    tab.onclick = () => { currentCategory = cat; loadPosts(); };
    bar.appendChild(tab);
  });
}

function buildWriteCategories() {
  const sel = document.getElementById('write-category');
  sel.innerHTML = '';
  CATEGORIES.filter(c => c !== '전체').forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    sel.appendChild(opt);
  });
}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-pw').value;
  const { error } = await db.auth.signInWithPassword({ email, password });
  if (error) document.getElementById('login-error').textContent = error.message;
}

async function logout() { await db.auth.signOut(); }

function escHtml(str) {
  const p = document.createElement('p');
  p.textContent = str;
  return p.innerHTML;
}

function formatDate(d) {
  const date = new Date(d);
  return `${date.getMonth() + 1}.${date.getDate()}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

// 전역 노출
window.navigate = navigate; window.doLogin = doLogin; window.logout = logout;

init();
</script>
</body>
</html>
