<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 커뮤니티</title>
  <style>
    /* =====================================================
       🎨 디자인 수정:
       --primary: 헤더 색상 (네이비)
       --accent: 강조색 (오렌지)
    ===================================================== */
    :root {
      --primary: #1a3f7a; --primary-dark: #122d58;
      --accent: #e05c00; --bg: #e8e8e8; --surface: #fff;
      --border: #c0c0c0; --border-light: #e0e0e0;
      --text: #222; --text-muted: #777;
      --notice-bg: #fff8e1; --danger: #cc2222; --reply-bg: #f5f8ff;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Malgun Gothic','맑은 고딕',Dotum,sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
    a{color:inherit;text-decoration:none} a:hover{color:var(--accent)}
    button{cursor:pointer;font-family:inherit;font-size:12px}
    input,textarea,select{font-family:inherit;font-size:13px}

    /* 헤더 */
    #header{background:var(--primary);color:#fff;border-bottom:3px solid var(--accent)}
    #header-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    #site-title{font-size:20px;font-weight:900;color:#fff;cursor:pointer}
    #site-title span{color:var(--accent)}
    #header-user{display:flex;align-items:center;gap:8px;font-size:12px}
    #header-user button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:3px}
    #header-user button:hover{background:rgba(255,255,255,.25)}

    /* 카테고리 탭 */
    #category-bar{background:var(--primary-dark);display:flex;align-items:center;padding:0 16px;overflow-x:auto}
    .cat-tab{padding:8px 14px;color:rgba(255,255,255,.7);cursor:pointer;font-size:12px;border-bottom:3px solid transparent;white-space:nowrap}
    .cat-tab:hover{color:#fff} .cat-tab.active{color:#fff;border-bottom-color:var(--accent);font-weight:bold}

    /* 레이아웃 */
    #main{max-width:980px;margin:14px auto;padding:0 8px}
    .card{background:var(--surface);border:1px solid var(--border)}
    .card-header{background:#f5f5f5;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
    .card-header h2{font-size:14px;font-weight:bold}

    /* 게시글 목록 */
    #post-table{width:100%;border-collapse:collapse}
    #post-table th{background:#f0f0f0;border:1px solid var(--border);padding:6px 8px;text-align:center;font-size:12px;color:#555;font-weight:bold}
    #post-table td{border:1px solid var(--border-light);padding:6px 8px}
    #post-table tr:hover td{background:#f9f9ff}
    .post-num{text-align:center;color:var(--text-muted);width:55px}
    .post-cat{text-align:center;width:60px}
    .post-cat span{background:var(--primary);color:#fff;padding:2px 6px;border-radius:2px;font-size:11px}
    .post-title-link{color:#1a1a1a;font-size:13px}
    .post-title-link:hover{color:var(--primary)}
    .post-title-link .comment-count{color:var(--accent);font-size:11px;margin-left:4px}
    .post-author{text-align:center;width:90px;color:var(--text-muted)}
    .post-date{text-align:center;width:80px;color:var(--text-muted);font-size:11px}
    .post-views{text-align:center;width:45px;color:var(--text-muted);font-size:11px}
    .post-votes-col{text-align:center;width:55px;font-size:11px}
    .post-row.notice td{background:var(--notice-bg)}
    .post-row.pinned .post-title-link{font-weight:bold}
    .pin-badge{background:var(--accent);color:#fff;font-size:10px;padding:1px 5px;border-radius:2px;margin-right:5px}
    .new-badge{color:var(--danger);font-size:11px;margin-left:3px;font-weight:bold}
    .upvote-text{color:#c00}

    /* 닉네임 색상 */
    .name-juddak{color:#ff6b00 !important;font-weight:bold}
    .name-paddak{color:#0066cc !important;font-weight:bold}
    .badge-juddak{background:#ff6b00;color:#fff;font-size:9px;padding:1px 4px;border-radius:2px;margin-left:3px;vertical-align:middle}
    .badge-paddak{background:#0066cc;color:#fff;font-size:9px;padding:1px 4px;border-radius:2px;margin-left:3px;vertical-align:middle}

    /* 페이징 */
    #pagination{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:12px}
    .page-btn{border:1px solid var(--border);background:var(--surface);padding:5px 9px;color:var(--text);border-radius:2px;min-width:30px;text-align:center}
    .page-btn:hover{background:#eef;border-color:var(--primary);color:var(--primary)}
    .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

    /* 버튼 */
    #board-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
    .btn{border:none;padding:6px 14px;border-radius:3px;font-size:12px;font-weight:bold}
    .btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:var(--primary-dark)}
    .btn-accent{background:var(--accent);color:#fff} .btn-accent:hover{background:#c45000}
    .btn-danger{background:var(--danger);color:#fff} .btn-danger:hover{background:#aa1111}
    .btn-outline{background:var(--surface);border:1px solid var(--border);color:var(--text)} .btn-outline:hover{background:#f0f0f0}
    .btn-sm{padding:3px 8px;font-size:11px}

    /* 검색 */
    #search-bar{display:flex;gap:4px}
    #search-bar input{border:1px solid var(--border);padding:5px 8px;width:180px}
    #search-bar select{border:1px solid var(--border);padding:5px}

    /* 게시글 상세 */
    #post-detail{background:var(--surface);border:1px solid var(--border)}
    .post-detail-header{padding:12px 14px;border-bottom:1px solid var(--border-light)}
    .post-detail-title{font-size:17px;font-weight:bold;margin-bottom:8px}
    .post-detail-meta{font-size:12px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap}
    .post-detail-body{padding:16px 14px;min-height:200px;line-height:1.7;font-size:14px;white-space:pre-wrap;word-break:break-all}
    .post-detail-actions{padding:8px 14px;border-top:1px solid var(--border-light);display:flex;gap:6px;justify-content:center}
    .back-btn{color:var(--primary);font-size:12px;cursor:pointer;margin-bottom:8px;display:inline-block}
    .back-btn:hover{text-decoration:underline}

    /* 개추/비추 */
    .vote-section{display:flex;justify-content:center;gap:16px;padding:14px;border-top:1px solid var(--border-light)}
    .vote-btn{display:flex;align-items:center;gap:6px;padding:8px 24px;border-radius:4px;font-size:14px;font-weight:bold;border:2px solid var(--border);background:var(--surface);transition:.2s}
    .vote-btn.up:hover,.vote-btn.up.active{background:#fff0f0;border-color:#cc2222;color:#cc2222}
    .vote-btn.down:hover,.vote-btn.down.active{background:#f0f0ff;border-color:#2244cc;color:#2244cc}

    /* 댓글 */
    #comment-section{margin-top:14px;background:var(--surface);border:1px solid var(--border)}
    .comment-header{background:#f0f0f0;border-bottom:1px solid var(--border);padding:7px 12px;font-weight:bold;font-size:13px}
    .comment-item{border-bottom:1px solid var(--border-light);padding:10px 14px}
    .comment-item:last-child{border-bottom:none}
    .comment-meta{font-size:11px;color:var(--text-muted);margin-bottom:5px;display:flex;gap:8px;align-items:center}
    .comment-author{font-weight:bold;color:var(--text)}
    .comment-body{font-size:13px;line-height:1.6;white-space:pre-wrap}
    .comment-actions{margin-top:5px;display:flex;gap:8px}
    .comment-action-btn{color:#888;font-size:11px;cursor:pointer;background:none;border:none;padding:0}
    .comment-action-btn:hover{color:var(--accent);text-decoration:underline}
    .comment-delete-btn{color:var(--danger) !important}

    /* 대댓글 */
    .replies{margin-top:6px;margin-left:20px;border-left:2px solid var(--border-light);padding-left:10px}
    .reply-item{padding:8px 10px;background:var(--reply-bg);border-bottom:1px solid var(--border-light);border-radius:2px;margin-bottom:4px}
    .reply-item:last-child{border-bottom:none;margin-bottom:0}
    .reply-arrow{color:#aaa;margin-right:4px;font-size:12px}
    .reply-form{margin-top:8px;margin-left:20px;background:#f8f8f8;border:1px solid var(--border);padding:8px;border-radius:3px}
    .reply-form textarea{width:100%;border:1px solid var(--border);padding:6px;resize:vertical;min-height:55px;border-radius:2px;font-size:12px}
    .reply-form-actions{margin-top:5px;display:flex;justify-content:flex-end;gap:5px}

    /* 댓글 작성 */
    .comment-write{padding:12px 14px;border-top:1px solid var(--border);background:#fafafa}
    .comment-write textarea{width:100%;border:1px solid var(--border);padding:8px;resize:vertical;min-height:70px;border-radius:2px}
    .comment-write-actions{margin-top:6px;display:flex;justify-content:flex-end}
    .no-comments{padding:20px;text-align:center;color:var(--text-muted)}

    /* 글쓰기 */
    #write-form{background:var(--surface);border:1px solid var(--border);padding:16px}
    .form-row{margin-bottom:12px}
    .form-row label{display:block;font-size:12px;font-weight:bold;color:#555;margin-bottom:4px}
    .form-row input,.form-row select,.form-row textarea{width:100%;border:1px solid var(--border);padding:8px;border-radius:2px}
    .form-row textarea{min-height:350px;resize:vertical;line-height:1.6}
    .form-row input:focus,.form-row textarea:focus,.form-row select:focus{outline:none;border-color:var(--primary)}
    .form-actions{display:flex;gap:8px;justify-content:flex-end}

    /* 로그인 */
    #login-box{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--border);padding:30px}
    #login-box h2{font-size:16px;margin-bottom:20px;text-align:center;color:var(--primary)}
    #login-tabs{display:flex;margin-bottom:20px;border-bottom:2px solid var(--border)}
    .login-tab{flex:1;padding:8px;text-align:center;cursor:pointer;color:var(--text-muted);font-size:13px;font-weight:bold;border-bottom:2px solid transparent;margin-bottom:-2px}
    .login-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    #login-error,#register-error{color:var(--danger);font-size:12px;margin-top:6px;text-align:center}

    /* 관리자 패널 */
    #admin-panel{background:var(--surface);border:1px solid var(--border)}
    .admin-section{padding:14px;border-bottom:1px solid var(--border-light)}
    .admin-section h3{font-size:14px;font-weight:bold;margin-bottom:10px;color:var(--primary)}
    .user-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:12px;flex-wrap:wrap}
    .user-row:last-child{border-bottom:none}
    .user-row .uname{flex:1;font-weight:bold}
    .banned-badge{background:var(--danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:2px}
    .admin-input-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .admin-input-row input{flex:1;border:1px solid var(--border);padding:6px 8px;border-radius:2px;min-width:100px}
    .admin-link{color:#fff;font-size:11px;background:rgba(255,100,0,.7);padding:3px 8px;border-radius:3px;cursor:pointer}

    /* 유틸 */
    .hidden{display:none !important}
    .msg-box{padding:20px;text-align:center;color:var(--text-muted)}
    .loading{padding:20px;text-align:center;color:var(--text-muted)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:4px;font-size:13px;z-index:9999}
    .banned-notice{background:#fee;border:1px solid var(--danger);color:var(--danger);padding:14px;text-align:center;border-radius:4px;margin:20px}
  </style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div id="site-title" onclick="navigate('board')">
      <!-- 💡 사이트 이름 수정 -->
      CCAS<span> DC</span>
    </div>
    <div id="header-user">
      <span id="header-username"></span>
      <button id="btn-admin-link" class="admin-link hidden" onclick="navigate('admin')">⚙ 관리자</button>
      <button id="btn-logout" class="hidden" onclick="logout()">로그아웃</button>
    </div>
  </div>
  <div id="category-bar"></div>
</div>

<div id="main">

  <!-- 로그인 -->
  <div id="view-login" class="hidden">
    <div id="login-box">
      <h2>🏫 CCAS DC</h2>
      <div id="login-tabs">
        <div class="login-tab active" onclick="switchLoginTab('login')">로그인</div>
        <div class="login-tab" onclick="switchLoginTab('register')">회원가입</div>
      </div>
      <div id="login-form">
        <div class="form-row"><label>이메일</label><input type="email" id="login-email" placeholder="이메일" /></div>
        <div class="form-row"><label>비밀번호</label><input type="password" id="login-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()" /></div>
        <div id="login-error"></div>
        <button class="btn btn-primary" onclick="doLogin()" style="width:100%;padding:10px;font-size:14px;margin-top:8px">로그인</button>
      </div>
      <div id="register-form" class="hidden">
        <div class="form-row"><label>닉네임 (2~12자)</label><input type="text" id="reg-nickname" placeholder="닉네임" maxlength="12" /></div>
        <div class="form-row"><label>이메일</label><input type="email" id="reg-email" placeholder="이메일" /></div>
        <div class="form-row"><label>비밀번호 (6자 이상)</label><input type="password" id="reg-pw" placeholder="비밀번호" /></div>
        <div id="register-error"></div>
        <button class="btn btn-accent" onclick="doRegister()" style="width:100%;padding:10px;font-size:14px;margin-top:8px">회원가입</button>
      </div>
    </div>
  </div>

  <!-- 게시판 -->
  <div id="view-board" class="hidden">
    <div class="card">
      <div class="card-header">
        <h2 id="board-title">전체 게시판</h2>
        <div id="search-bar">
          <select id="search-type"><option value="title">제목</option><option value="content">내용</option><option value="author">작성자</option></select>
          <input type="text" id="search-input" placeholder="검색어" onkeydown="if(event.key==='Enter')doSearch()" />
          <button class="btn btn-outline" onclick="doSearch()">검색</button>
          <button class="btn btn-outline" onclick="clearSearch()">초기화</button>
        </div>
      </div>
      <table id="post-table">
        <thead>
          <tr>
            <th style="width:55px">번호</th>
            <th style="width:60px">분류</th>
            <th>제목</th>
            <th style="width:90px">작성자</th>
            <th style="width:80px">작성일</th>
            <th style="width:45px">조회</th>
            <th style="width:55px">개추</th>
          </tr>
        </thead>
        <tbody id="post-list-body"><tr><td colspan="7" class="loading">불러오는 중...</td></tr></tbody>
      </table>
      <div id="board-actions">
        <div id="pagination"></div>
        <button class="btn btn-primary" onclick="navigate('write')">✏ 글쓰기</button>
      </div>
    </div>
  </div>

  <!-- 게시글 상세 -->
  <div id="view-post" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 목록으로</span>
    <div id="post-detail">
      <div class="post-detail-header">
        <div class="post-detail-title" id="detail-title"></div>
        <div class="post-detail-meta">
          <span>👤 <b id="detail-author"></b></span>
          <span>🗂 <span id="detail-category"></span></span>
          <span>📅 <span id="detail-date"></span></span>
          <span>👁 <span id="detail-views"></span>회</span>
        </div>
      </div>
      <div class="post-detail-body" id="detail-body"></div>
      <div class="vote-section">
        <button class="vote-btn up" id="btn-upvote" onclick="votePost('up')">👍 개추 <span id="upvote-count">0</span></button>
        <button class="vote-btn down" id="btn-downvote" onclick="votePost('down')">👎 비추 <span id="downvote-count">0</span></button>
      </div>
      <div class="post-detail-actions" id="detail-actions"></div>
    </div>
    <div id="comment-section">
      <div class="comment-header">💬 댓글 <span id="comment-count">0</span>개</div>
      <div id="comment-list"></div>
      <div class="comment-write">
        <div style="font-size:12px;color:#555;margin-bottom:6px"><b id="comment-username"></b>으로 댓글 작성</div>
        <textarea id="comment-input" placeholder="댓글을 입력하세요"></textarea>
        <div class="comment-write-actions"><button class="btn btn-primary" onclick="submitComment()">댓글 등록</button></div>
      </div>
    </div>
  </div>

  <!-- 글쓰기 -->
  <div id="view-write" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 목록으로</span>
    <div id="write-form">
      <div class="card-header" style="margin:-16px -16px 16px"><h2 id="write-title">✏ 글쓰기</h2></div>
      <div class="form-row"><label>분류</label><select id="write-category"></select></div>
      <div class="form-row"><label>제목</label><input type="text" id="write-post-title" placeholder="제목" maxlength="100" /></div>
      <div class="form-row"><label>내용</label><textarea id="write-content" placeholder="내용을 입력하세요"></textarea></div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="navigate('board')">취소</button>
        <button class="btn btn-primary" id="btn-submit-post" onclick="submitPost()">등록</button>
      </div>
    </div>
  </div>

  <!-- 관리자 패널 -->
  <div id="view-admin" class="hidden">
    <span class="back-btn" onclick="navigate('board')">← 게시판으로</span>
    <div id="admin-panel" class="card">
      <div class="card-header"><h2>⚙ 관리자 패널</h2></div>

      <div class="admin-section">
        <h3>👤 유저 검색</h3>
        <div class="admin-input-row">
          <input type="text" id="admin-search-user" placeholder="닉네임으로 검색" />
          <button class="btn btn-outline" onclick="adminSearchUser()">검색</button>
        </div>
        <div id="admin-user-result"></div>
      </div>

      <div class="admin-section">
        <h3>📋 전체 유저 목록</h3>
        <div id="admin-user-list"><div class="loading">불러오는 중...</div></div>
      </div>

      <div class="admin-section">
        <h3>📌 공지 고정 / 게시글 삭제</h3>
        <div class="admin-input-row">
          <input type="number" id="admin-pin-id" placeholder="게시글 ID" />
          <button class="btn btn-accent" onclick="adminPinPost(true)">고정</button>
          <button class="btn btn-outline" onclick="adminPinPost(false)">고정해제</button>
        </div>
        <div class="admin-input-row">
          <input type="number" id="admin-del-id" placeholder="게시글 ID" />
          <button class="btn btn-danger" onclick="adminDeletePost()">삭제</button>
        </div>
      </div>

      <div class="admin-section" id="ban-section">
        <h3>🚫 밴 관리 <span style="font-size:11px;color:#999">(주딱 전용)</span></h3>
        <div class="admin-input-row">
          <input type="text" id="admin-ban-uid" placeholder="유저 ID (아래 목록에서 선택)" />
          <input type="text" id="admin-ban-reason" placeholder="밴 사유" style="flex:2" />
          <button class="btn btn-danger" onclick="adminBanUser()">밴</button>
          <button class="btn btn-outline" onclick="adminUnbanUser()">해제</button>
        </div>
      </div>

      <div class="admin-section" id="level-section">
        <h3>👑 관리자 등급 설정 <span style="font-size:11px;color:#999">(주딱 전용)</span></h3>
        <div style="font-size:12px;color:#777;margin-bottom:8px">주딱(2): 🟠 오렌지 | 파딱(1): 🔵 파랑 | 일반(0): 일반</div>
        <div class="admin-input-row">
          <input type="text" id="admin-level-uid" placeholder="유저 ID" />
          <select id="admin-level-val" style="border:1px solid var(--border);padding:6px;border-radius:2px">
            <option value="2">주딱 (레벨2)</option>
            <option value="1">파딱 (레벨1)</option>
            <option value="0">일반 (레벨0)</option>
          </select>
          <button class="btn btn-primary" onclick="adminSetLevel()">적용</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ================================================================

-- profiles에 admin_level 추가 (0=일반, 1=파딱, 2=주딱)
alter table profiles add column if not exists admin_level integer default 0;

-- posts에 투표 컬럼 추가
alter table posts add column if not exists upvotes integer default 0;
alter table posts add column if not exists downvotes integer default 0;

-- 투표 기록 테이블
create table if not exists post_votes (
  post_id bigint references posts(id) on delete cascade,
  user_id uuid references profiles(id) on delete cascade,
  vote_type text check (vote_type in ('up','down')),
  primary key (post_id, user_id)
);
alter table post_votes enable row level security;
create policy "투표 조회" on post_votes for select using (auth.role()='authenticated');
create policy "투표 추가" on post_votes for insert with check (auth.uid()=user_id);
create policy "투표 수정" on post_votes for update using (auth.uid()=user_id);
create policy "투표 삭제" on post_votes for delete using (auth.uid()=user_id);

-- 대댓글용 parent_id
alter table comments add column if not exists parent_id bigint references comments(id) on delete cascade;

-- 투표 함수
create or replace function vote_post(p_post_id bigint, p_vote_type text)
returns void as $$
declare existing_vote text;
begin
  select vote_type into existing_vote from post_votes where post_id=p_post_id and user_id=auth.uid();
  if existing_vote is null then
    insert into post_votes(post_id,user_id,vote_type) values(p_post_id,auth.uid(),p_vote_type);
    if p_vote_type='up' then update posts set upvotes=upvotes+1 where id=p_post_id;
    else update posts set downvotes=downvotes+1 where id=p_post_id; end if;
  elsif existing_vote=p_vote_type then
    delete from post_votes where post_id=p_post_id and user_id=auth.uid();
    if p_vote_type='up' then update posts set upvotes=greatest(0,upvotes-1) where id=p_post_id;
    else update posts set downvotes=greatest(0,downvotes-1) where id=p_post_id; end if;
  else
    update post_votes set vote_type=p_vote_type where post_id=p_post_id and user_id=auth.uid();
    if p_vote_type='up' then update posts set upvotes=upvotes+1,downvotes=greatest(0,downvotes-1) where id=p_post_id;
    else update posts set downvotes=downvotes+1,upvotes=greatest(0,upvotes-1) where id=p_post_id; end if;
  end if;
end;
$$ language plpgsql security definer set search_path=public;

-- 밴 함수 업데이트 (주딱만 가능)
create or replace function admin_ban_user(target_id uuid, reason text, ban boolean)
returns void as $$
begin
  if not exists(select 1 from profiles where id=auth.uid() and admin_level>=2) then
    raise exception '주딱 권한이 필요합니다.';
  end if;
  update profiles set is_banned=ban, ban_reason=case when ban then reason else null end where id=target_id;
end;
$$ language plpgsql security definer set search_path=public;

-- 관리자 등급 설정 함수 (주딱만 가능)
create or replace function admin_set_level(target_id uuid, level integer)
returns void as $$
begin
  if not exists(select 1 from profiles where id=auth.uid() and admin_level>=2) then
    raise exception '주딱 권한이 필요합니다.';
  end if;
  update profiles set admin_level=level where id=target_id;
end;
$$ language plpgsql security definer set search_path=public;

-- posts RLS 수정 (파딱 이상 삭제 가능)
drop policy if exists "본인 또는 관리자 글 삭제" on posts;
create policy "본인 또는 관리자 글 삭제" on posts for delete
  using (auth.uid()=author_id or auth.uid() in (select id from profiles where admin_level>=1));

-- comments RLS 수정
drop policy if exists "본인 또는 관리자 댓글 삭제" on comments;
create policy "본인 또는 관리자 댓글 삭제" on comments for delete
  using (auth.uid()=author_id or auth.uid() in (select id from profiles where admin_level>=1));

================================================================ */

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null, currentProfile = null, currentView = null;
let currentCategory = '전체', currentPage = 1, currentPostId = null;
let editingPostId = null, searchQuery = null, searchType = 'title';

document.title = SITE_NAME;

/* ── 초기화 ── */
async function init() {
  buildCategoryBar();
  buildWriteCategories();
  const { data: { session } } = await db.auth.getSession();
  if (session) { currentUser = session.user; await loadProfile(); }
  db.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN') { currentUser = session.user; await loadProfile(); navigate('board'); }
    else if (event === 'SIGNED_OUT') { currentUser = null; currentProfile = null; updateHeader(); navigate('login'); }
  });
  if (!currentUser) navigate('login'); else navigate('board');
}

async function loadProfile() {
  const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
  updateHeader();
}

function updateHeader() {
  const nameEl = document.getElementById('header-username');
  const logoutBtn = document.getElementById('btn-logout');
  const adminBtn = document.getElementById('btn-admin-link');
  if (currentProfile) {
    const level = currentProfile.admin_level || 0;
    const nameClass = level >= 2 ? 'name-juddak' : level >= 1 ? 'name-paddak' : '';
    const badge = level >= 2 ? '<span class="badge-juddak">주딱</span>' : level >= 1 ? '<span class="badge-paddak">파딱</span>' : '';
    nameEl.innerHTML = `<span class="${nameClass}">${escHtml(currentProfile.username)}</span>${badge}님`;
    logoutBtn.classList.remove('hidden');
    if (level >= 1) adminBtn.classList.remove('hidden'); else adminBtn.classList.add('hidden');
  } else {
    nameEl.textContent = '';
    logoutBtn.classList.add('hidden');
    adminBtn.classList.add('hidden');
  }
}

/* ── 닉네임 HTML 생성 ── */
function nameHtml(name, adminLevel) {
  const level = adminLevel || 0;
  const cls = level >= 2 ? 'name-juddak' : level >= 1 ? 'name-paddak' : '';
  const badge = level >= 2 ? '<span class="badge-juddak">주딱</span>' : level >= 1 ? '<span class="badge-paddak">파딱</span>' : '';
  return `<span class="comment-author ${cls}">${escHtml(name || '(탈퇴)')}</span>${badge}`;
}

function buildCategoryBar() {
  const bar = document.getElementById('category-bar');
  bar.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const tab = document.createElement('div');
    tab.className = 'cat-tab' + (cat === currentCategory ? ' active' : '');
    tab.textContent = cat;
    tab.onclick = () => {
      currentCategory = cat; currentPage = 1; searchQuery = null;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('board-title').textContent = cat + ' 게시판';
      loadPosts();
    };
    bar.appendChild(tab);
  });
}

function buildWriteCategories() {
  const sel = document.getElementById('write-category');
  sel.innerHTML = '';
  CATEGORIES.filter(c => c !== '전체').forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    sel.appendChild(opt);
  });
}

/* ── 라우터 ── */
function navigate(view, params = {}) {
  if (view !== 'login' && !currentUser) { navigate('login'); return; }
  if (view !== 'login' && currentProfile?.is_banned) { showBannedNotice(); return; }
  ['login','board','post','write','admin'].forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
  currentView = view;
  document.getElementById('view-'+view).classList.remove('hidden');
  if (view === 'board') loadPosts();
  if (view === 'post' && params.postId) { currentPostId = params.postId; loadPostDetail(params.postId); }
  if (view === 'write') { editingPostId = params.editId || null; editingPostId ? loadEditPost(editingPostId) : resetWriteForm(); }
  if (view === 'admin') loadAdminPanel();
  window.scrollTo(0, 0);
}

function showBannedNotice() {
  ['login','board','post','write','admin'].forEach(v => document.getElementById('view-'+v).classList.add('hidden'));
  document.getElementById('main').innerHTML = `
    <div class="banned-notice">
      <h2 style="margin-bottom:8px">⛔ 이용 제한 계정</h2>
      <p>관리자에 의해 이용이 제한된 계정입니다.</p>
      <p style="margin-top:6px;font-size:12px;color:#999">사유: ${escHtml(currentProfile?.ban_reason||'사유 없음')}</p>
      <button class="btn btn-outline" style="margin-top:14px" onclick="logout()">로그아웃</button>
    </div>`;
}

/* ── 인증 ── */
function switchLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach((t,i) => t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-form').classList.toggle('hidden', tab!=='login');
  document.getElementById('register-form').classList.toggle('hidden', tab!=='register');
  document.getElementById('login-error').textContent = '';
  document.getElementById('register-error').textContent = '';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  if (!email||!pw) { document.getElementById('login-error').textContent='이메일과 비밀번호를 입력하세요.'; return; }
  const { error } = await db.auth.signInWithPassword({ email, password: pw });
  if (error) document.getElementById('login-error').textContent = '로그인 실패: 이메일/비밀번호를 확인하세요.';
}

async function doRegister() {
  const nickname = document.getElementById('reg-nickname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pw = document.getElementById('reg-pw').value;
  const errEl = document.getElementById('register-error');
  if (!nickname||nickname.length<2) { errEl.textContent='닉네임을 2자 이상 입력하세요.'; return; }
  if (!/^[가-힣a-zA-Z0-9]+$/.test(nickname)) { errEl.textContent='닉네임은 한글, 영문, 숫자만 가능합니다.'; return; }
  if (!email) { errEl.textContent='이메일을 입력하세요.'; return; }
  if (pw.length<6) { errEl.textContent='비밀번호를 6자 이상 입력하세요.'; return; }
  const { data: ex } = await db.from('profiles').select('id').eq('username', nickname).maybeSingle();
  if (ex) { errEl.textContent='이미 사용 중인 닉네임입니다.'; return; }
  const { error } = await db.auth.signUp({ email, password: pw, options: { data: { username: nickname } } });
  if (error) { errEl.textContent='가입 실패: '+error.message; return; }
  showToast('가입 완료! 로그인하세요.'); switchLoginTab('login');
}

async function logout() { await db.auth.signOut(); }

/* ── 게시글 목록 ── */
async function loadPosts() {
  const tbody = document.getElementById('post-list-body');
  tbody.innerHTML = '<tr><td colspan="7" class="loading">불러오는 중...</td></tr>';
  let query = db.from('posts').select('id,title,author_name,author_admin_level,category,is_pinned,view_count,comment_count,upvotes,downvotes,created_at', { count: 'exact' });
  if (currentCategory !== '전체') query = query.eq('category', currentCategory);
  if (searchQuery) {
    if (searchType==='title') query = query.ilike('title',`%${searchQuery}%`);
    else if (searchType==='content') query = query.ilike('content',`%${searchQuery}%`);
    else query = query.ilike('author_name',`%${searchQuery}%`);
  }
  query = query.order('is_pinned',{ascending:false}).order('created_at',{ascending:false});
  const from = (currentPage-1)*PAGE_SIZE;
  query = query.range(from, from+PAGE_SIZE-1);
  const { data: posts, count, error } = await query;
  if (error) { tbody.innerHTML='<tr><td colspan="7" class="msg-box">오류가 발생했습니다.</td></tr>'; return; }
  if (!posts||posts.length===0) { tbody.innerHTML='<tr><td colspan="7" class="msg-box">게시글이 없습니다.</td></tr>'; return; }
  tbody.innerHTML = '';
  posts.forEach((post, idx) => {
    const isNew = (Date.now()-new Date(post.created_at).getTime()) < 3600000;
    const tr = document.createElement('tr');
    tr.className = 'post-row'+(post.is_pinned?' notice pinned':'');
    const level = post.author_admin_level || 0;
    const nameCls = level>=2?'name-juddak':level>=1?'name-paddak':'';
    tr.innerHTML = `
      <td class="post-num">${post.is_pinned?'📌':(count-from-idx)}</td>
      <td class="post-cat"><span>${escHtml(post.category)}</span></td>
      <td>
        ${post.is_pinned?'<span class="pin-badge">공지</span>':''}
        <a class="post-title-link" href="#" onclick="navigate('post',{postId:${post.id}});return false">
          ${escHtml(post.title)}
          ${post.comment_count>0?`<span class="comment-count">[${post.comment_count}]</span>`:''}
          ${isNew?'<span class="new-badge">N</span>':''}
        </a>
      </td>
      <td class="post-author"><span class="${nameCls}">${escHtml(post.author_name||'(탈퇴)')}</span></td>
      <td class="post-date">${formatDate(post.created_at)}</td>
      <td class="post-views">${post.view_count||0}</td>
      <td class="post-votes-col"><span class="upvote-text">👍${post.upvotes||0}</span></td>`;
    tbody.appendChild(tr);
  });
  buildPagination(count);
}

function buildPagination(total) {
  const totalPages = Math.ceil(total/PAGE_SIZE);
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages<=1) return;
  const start = Math.max(1,currentPage-4), end = Math.min(totalPages,start+9);
  if (currentPage>1) { const b=document.createElement('button'); b.className='page-btn'; b.textContent='◀'; b.onclick=()=>{currentPage--;loadPosts()}; pg.appendChild(b); }
  for (let i=start;i<=end;i++) {
    const b=document.createElement('button'); b.className='page-btn'+(i===currentPage?' active':''); b.textContent=i;
    const p=i; b.onclick=()=>{currentPage=p;loadPosts()}; pg.appendChild(b);
  }
  if (currentPage<totalPages) { const b=document.createElement('button'); b.className='page-btn'; b.textContent='▶'; b.onclick=()=>{currentPage++;loadPosts()}; pg.appendChild(b); }
}

function doSearch() { searchQuery=document.getElementById('search-input').value.trim()||null; searchType=document.getElementById('search-type').value; currentPage=1; loadPosts(); }
function clearSearch() { searchQuery=null; document.getElementById('search-input').value=''; currentPage=1; loadPosts(); }

/* ── 게시글 상세 ── */
async function loadPostDetail(postId) {
  document.getElementById('detail-title').textContent = '불러오는 중...';
  document.getElementById('detail-body').textContent = '';
  try { await db.rpc('increment_view',{post_id:postId}); } catch(e) {}
  const { data: post } = await db.from('posts').select('*').eq('id', postId).single();
  if (!post) { navigate('board'); return; }

  const level = post.author_admin_level || 0;
  const nameCls = level>=2?'name-juddak':level>=1?'name-paddak':'';
  const badge = level>=2?'<span class="badge-juddak">주딱</span>':level>=1?'<span class="badge-paddak">파딱</span>':'';
  document.getElementById('detail-title').textContent = post.title;
  document.getElementById('detail-author').innerHTML = `<span class="${nameCls}">${escHtml(post.author_name||'(탈퇴)')}</span>${badge}`;
  document.getElementById('detail-category').textContent = post.category;
  document.getElementById('detail-date').textContent = formatDateFull(post.created_at);
  document.getElementById('detail-views').textContent = (post.view_count||0)+1;
  document.getElementById('detail-body').textContent = post.content;
  document.getElementById('upvote-count').textContent = post.upvotes||0;
  document.getElementById('downvote-count').textContent = post.downvotes||0;

  // 내 투표 상태
  if (currentUser) {
    const { data: myVote } = await db.from('post_votes').select('vote_type').eq('post_id',postId).eq('user_id',currentUser.id).maybeSingle();
    document.getElementById('btn-upvote').classList.toggle('active', myVote?.vote_type==='up');
    document.getElementById('btn-downvote').classList.toggle('active', myVote?.vote_type==='down');
  }

  const actionsEl = document.getElementById('detail-actions');
  actionsEl.innerHTML = '';
  const isOwner = currentUser && post.author_id === currentUser.id;
  const myLevel = currentProfile?.admin_level || 0;
  const isPaddak = myLevel >= 1, isJuddak = myLevel >= 2;

  if (isOwner) { const b=document.createElement('button'); b.className='btn btn-outline'; b.textContent='수정'; b.onclick=()=>navigate('write',{editId:post.id}); actionsEl.appendChild(b); }
  if (isOwner||isPaddak) { const b=document.createElement('button'); b.className='btn btn-danger'; b.textContent='삭제'; b.onclick=()=>deletePost(post.id); actionsEl.appendChild(b); }
  if (isPaddak && !post.is_pinned) { const b=document.createElement('button'); b.className='btn btn-accent'; b.textContent='📌 공지고정'; b.onclick=()=>togglePin(post.id,true); actionsEl.appendChild(b); }
  if (isPaddak && post.is_pinned) { const b=document.createElement('button'); b.className='btn btn-outline'; b.textContent='고정해제'; b.onclick=()=>togglePin(post.id,false); actionsEl.appendChild(b); }
  if (isJuddak && post.author_id) { const b=document.createElement('button'); b.className='btn btn-danger'; b.textContent='작성자 밴'; b.onclick=()=>{const r=prompt('밴 사유:');if(r)quickBanUser(post.author_id,r);}; actionsEl.appendChild(b); }

  document.getElementById('comment-username').textContent = currentProfile?.username || '';
  loadComments(postId);
}

/* ── 투표 ── */
async function votePost(type) {
  if (!currentPostId) return;
  const { error } = await db.rpc('vote_post',{p_post_id:currentPostId, p_vote_type:type});
  if (!error) {
    const { data: post } = await db.from('posts').select('upvotes,downvotes').eq('id',currentPostId).single();
    if (post) {
      document.getElementById('upvote-count').textContent = post.upvotes||0;
      document.getElementById('downvote-count').textContent = post.downvotes||0;
    }
    const { data: myVote } = await db.from('post_votes').select('vote_type').eq('post_id',currentPostId).eq('user_id',currentUser.id).maybeSingle();
    document.getElementById('btn-upvote').classList.toggle('active', myVote?.vote_type==='up');
    document.getElementById('btn-downvote').classList.toggle('active', myVote?.vote_type==='down');
  } else showToast('투표 실패: '+error.message);
}

async function deletePost(postId) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  const { error } = await db.from('posts').delete().eq('id', postId);
  if (!error) { showToast('삭제되었습니다.'); navigate('board'); }
  else showToast('삭제 실패: '+error.message);
}

async function togglePin(postId, pin) {
  const { error } = await db.from('posts').update({is_pinned:pin}).eq('id', postId);
  if (!error) { showToast(pin?'공지로 고정되었습니다.':'고정 해제되었습니다.'); loadPostDetail(postId); }
}

/* ── 댓글 ── */
async function loadComments(postId) {
  // comments + profiles join으로 admin_level 가져오기
  const { data: comments } = await db.from('comments')
    .select('*, profiles(admin_level)')
    .eq('post_id', postId)
    .order('created_at', { ascending: true });

  const listEl = document.getElementById('comment-list');
  const countEl = document.getElementById('comment-count');
  countEl.textContent = comments?.length || 0;

  if (!comments||comments.length===0) {
    listEl.innerHTML = '<div class="no-comments">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</div>';
    return;
  }

  listEl.innerHTML = '';
  const myLevel = currentProfile?.admin_level || 0;
  const isPaddak = myLevel >= 1, isJuddak = myLevel >= 2;

  // 부모 댓글만 먼저
  const parents = comments.filter(c => !c.parent_id);
  const replies = comments.filter(c => c.parent_id);

  parents.forEach(c => {
    const adminLevel = c.profiles?.admin_level || 0;
    const canDelete = (currentUser && c.author_id===currentUser.id) || isPaddak;
    const div = document.createElement('div');
    div.className = 'comment-item';
    div.id = 'comment-'+c.id;
    div.innerHTML = `
      <div class="comment-meta">
        ${nameHtml(c.author_name, adminLevel)}
        <span>${formatDateFull(c.created_at)}</span>
      </div>
      <div class="comment-body">${escHtml(c.content)}</div>
      <div class="comment-actions">
        <button class="comment-action-btn" onclick="showReplyForm(${c.id})">💬 답글</button>
        ${canDelete?`<button class="comment-action-btn comment-delete-btn" onclick="deleteComment(${c.id},${postId})">삭제</button>`:''}
        ${isJuddak&&c.author_id?`<button class="comment-action-btn comment-delete-btn" onclick="quickBanUser('${c.author_id}','댓글 규정 위반')">작성자 밴</button>`:''}
      </div>
      <div class="reply-form hidden" id="reply-form-${c.id}">
        <textarea id="reply-input-${c.id}" placeholder="답글을 입력하세요" style="width:100%;border:1px solid var(--border);padding:6px;resize:vertical;min-height:55px;border-radius:2px;font-size:12px"></textarea>
        <div class="reply-form-actions">
          <button class="btn btn-outline btn-sm" onclick="hideReplyForm(${c.id})">취소</button>
          <button class="btn btn-primary btn-sm" onclick="submitReply(${c.id},${postId})">등록</button>
        </div>
      </div>
      <div class="replies" id="replies-${c.id}"></div>`;
    listEl.appendChild(div);

    // 대댓글 렌더링
    const myReplies = replies.filter(r => r.parent_id === c.id);
    const repliesEl = div.querySelector('#replies-'+c.id);
    myReplies.forEach(r => {
      const rLevel = r.profiles?.admin_level || 0;
      const rCanDelete = (currentUser && r.author_id===currentUser.id) || isPaddak;
      const rdiv = document.createElement('div');
      rdiv.className = 'reply-item';
      rdiv.id = 'comment-'+r.id;
      rdiv.innerHTML = `
        <div class="comment-meta">
          <span class="reply-arrow">↳</span>
          ${nameHtml(r.author_name, rLevel)}
          <span>${formatDateFull(r.created_at)}</span>
          ${rCanDelete?`<button class="comment-action-btn comment-delete-btn" onclick="deleteComment(${r.id},${postId})">삭제</button>`:''}
        </div>
        <div class="comment-body" style="padding-left:16px">${escHtml(r.content)}</div>`;
      repliesEl.appendChild(rdiv);
    });
  });
}

function showReplyForm(commentId) {
  document.querySelectorAll('.reply-form').forEach(f => f.classList.add('hidden'));
  document.getElementById('reply-form-'+commentId).classList.remove('hidden');
  document.getElementById('reply-input-'+commentId).focus();
}
function hideReplyForm(commentId) {
  document.getElementById('reply-form-'+commentId).classList.add('hidden');
}

async function submitReply(parentId, postId) {
  const input = document.getElementById('reply-input-'+parentId);
  const content = input.value.trim();
  if (!content) { showToast('내용을 입력하세요.'); return; }
  const { error } = await db.from('comments').insert({
    post_id: postId, parent_id: parentId,
    author_id: currentUser.id, author_name: currentProfile.username, content
  });
  if (!error) { input.value=''; hideReplyForm(parentId); loadComments(postId); showToast('답글이 등록되었습니다.'); }
  else showToast('등록 실패: '+error.message);
}

async function submitComment() {
  const input = document.getElementById('comment-input');
  const content = input.value.trim();
  if (!content) { showToast('댓글 내용을 입력하세요.'); return; }
  if (!currentPostId) return;
  const { error } = await db.from('comments').insert({
    post_id: currentPostId, author_id: currentUser.id, author_name: currentProfile.username, content
  });
  if (!error) { input.value=''; loadComments(currentPostId); showToast('댓글이 등록되었습니다.'); }
  else showToast('댓글 등록 실패: '+error.message);
}

async function deleteComment(commentId, postId) {
  if (!confirm('댓글을 삭제하시겠습니까?')) return;
  const { error } = await db.from('comments').delete().eq('id', commentId);
  if (!error) { loadComments(postId); showToast('삭제되었습니다.'); }
}

/* ── 글쓰기 ── */
function resetWriteForm() {
  document.getElementById('write-title').textContent='✏ 글쓰기';
  document.getElementById('btn-submit-post').textContent='등록';
  document.getElementById('write-post-title').value='';
  document.getElementById('write-content').value='';
  editingPostId=null;
}

async function loadEditPost(postId) {
  const { data: post } = await db.from('posts').select('*').eq('id', postId).single();
  if (!post) return;
  document.getElementById('write-title').textContent='✏ 글 수정';
  document.getElementById('btn-submit-post').textContent='수정 완료';
  document.getElementById('write-post-title').value=post.title;
  document.getElementById('write-content').value=post.content;
  document.getElementById('write-category').value=post.category;
}

async function submitPost() {
  const title = document.getElementById('write-post-title').value.trim();
  const content = document.getElementById('write-content').value.trim();
  const category = document.getElementById('write-category').value;
  if (!title) { showToast('제목을 입력하세요.'); return; }
  if (!content) { showToast('내용을 입력하세요.'); return; }
  if (editingPostId) {
    const { error } = await db.from('posts').update({title,content,category}).eq('id',editingPostId);
    if (!error) { showToast('수정되었습니다.'); navigate('post',{postId:editingPostId}); }
    else showToast('수정 실패: '+error.message);
  } else {
    const { data, error } = await db.from('posts').insert({
      title, content, category,
      author_id: currentUser.id,
      author_name: currentProfile.username,
      author_admin_level: currentProfile.admin_level || 0
    }).select().single();
    if (!error&&data) { showToast('등록되었습니다.'); navigate('post',{postId:data.id}); }
    else showToast('등록 실패: '+error?.message);
  }
}

/* ── 관리자 패널 ── */
async function loadAdminPanel() {
  const myLevel = currentProfile?.admin_level || 0;
  if (myLevel < 1) { navigate('board'); return; }
  // 주딱만 밴/등급 설정 보이게
  document.getElementById('ban-section').style.display = myLevel>=2?'':'none';
  document.getElementById('level-section').style.display = myLevel>=2?'':'none';
  await loadAdminUserList();
}

async function loadAdminUserList() {
  const { data: users } = await db.from('profiles').select('*').order('created_at',{ascending:false}).limit(100);
  const el = document.getElementById('admin-user-list');
  if (!users) { el.innerHTML='<div class="msg-box">불러오기 실패</div>'; return; }
  el.innerHTML='';
  const myLevel = currentProfile?.admin_level || 0;
  users.forEach(u => {
    const level = u.admin_level || 0;
    const badge = level>=2?'<span class="badge-juddak">주딱</span>':level>=1?'<span class="badge-paddak">파딱</span>':'';
    const nameCls = level>=2?'name-juddak':level>=1?'name-paddak':'';
    const row = document.createElement('div');
    row.className='user-row';
    row.innerHTML=`
      <span class="uname ${nameCls}">${escHtml(u.username)}</span>${badge}
      <span style="color:#999;font-size:10px">${u.id.substring(0,8)}...</span>
      ${u.is_banned?`<span class="banned-badge">밴(${escHtml(u.ban_reason||'')})</span>`:''}
      ${myLevel>=2?`<button class="btn btn-outline btn-sm" onclick="prefillBan('${u.id}')">밴설정</button>`:''}
      ${myLevel>=2?`<button class="btn btn-outline btn-sm" onclick="prefillLevel('${u.id}')">등급설정</button>`:''}`;
    el.appendChild(row);
  });
}

function prefillBan(uid) { document.getElementById('admin-ban-uid').value=uid; showToast('사유 입력 후 밴/해제 클릭'); }
function prefillLevel(uid) { document.getElementById('admin-level-uid').value=uid; showToast('등급 선택 후 적용 클릭'); }

async function adminSearchUser() {
  const q = document.getElementById('admin-search-user').value.trim();
  if (!q) return;
  const { data } = await db.from('profiles').select('*').ilike('username',`%${q}%`).limit(5);
  const el = document.getElementById('admin-user-result');
  if (!data||data.length===0) { el.innerHTML='<div style="font-size:12px;color:#999;padding:6px">검색 결과 없음</div>'; return; }
  el.innerHTML='';
  data.forEach(u => {
    const row=document.createElement('div'); row.className='user-row';
    row.innerHTML=`<span class="uname">${escHtml(u.username)}</span><span style="color:#999;font-size:10px">${u.id}</span>
      ${u.is_banned?'<span class="banned-badge">밴됨</span>':''}
      <button class="btn btn-outline btn-sm" onclick="prefillBan('${u.id}')">밴설정</button>
      <button class="btn btn-outline btn-sm" onclick="prefillLevel('${u.id}')">등급설정</button>`;
    el.appendChild(row);
  });
}

async function adminBanUser() {
  const uid = document.getElementById('admin-ban-uid').value.trim();
  const reason = document.getElementById('admin-ban-reason').value.trim();
  if (!uid) { showToast('유저 ID를 입력하세요.'); return; }
  if (!reason) { showToast('밴 사유를 입력하세요.'); return; }
  if (!confirm(`밴하시겠습니까?\n사유: ${reason}`)) return;
  const { error } = await db.rpc('admin_ban_user',{target_id:uid,reason,ban:true});
  if (!error) { showToast('밴 완료.'); loadAdminUserList(); } else showToast('실패: '+error.message);
}

async function adminUnbanUser() {
  const uid = document.getElementById('admin-ban-uid').value.trim();
  if (!uid) { showToast('유저 ID를 입력하세요.'); return; }
  if (!confirm('밴을 해제하시겠습니까?')) return;
  const { error } = await db.rpc('admin_ban_user',{target_id:uid,reason:'',ban:false});
  if (!error) { showToast('밴 해제 완료.'); loadAdminUserList(); } else showToast('실패: '+error.message);
}

async function adminSetLevel() {
  const uid = document.getElementById('admin-level-uid').value.trim();
  const level = parseInt(document.getElementById('admin-level-val').value);
  if (!uid) { showToast('유저 ID를 입력하세요.'); return; }
  const labels = {0:'일반',1:'파딱',2:'주딱'};
  if (!confirm(`${labels[level]}으로 설정하시겠습니까?`)) return;
  const { error } = await db.rpc('admin_set_level',{target_id:uid,level});
  if (!error) { showToast(`${labels[level]}으로 설정 완료.`); loadAdminUserList(); } else showToast('실패: '+error.message);
}

async function adminPinPost(pin) {
  const id = document.getElementById('admin-pin-id').value;
  if (!id) { showToast('게시글 ID를 입력하세요.'); return; }
  const { error } = await db.from('posts').update({is_pinned:pin}).eq('id',id);
  if (!error) showToast(pin?'공지로 고정되었습니다.':'고정이 해제되었습니다.'); else showToast('실패: '+error.message);
}

async function adminDeletePost() {
  const id = document.getElementById('admin-del-id').value;
  if (!id) { showToast('게시글 ID를 입력하세요.'); return; }
  if (!confirm('삭제하시겠습니까?')) return;
  const { error } = await db.from('posts').delete().eq('id',id);
  if (!error) showToast('삭제 완료.'); else showToast('실패: '+error.message);
}

async function quickBanUser(uid, reason) {
  if (!uid||uid===currentUser?.id) { showToast('본인은 밴할 수 없습니다.'); return; }
  if (!confirm(`밴하시겠습니까?\n사유: ${reason}`)) return;
  const { error } = await db.rpc('admin_ban_user',{target_id:uid,reason,ban:true});
  if (!error) showToast('밴 완료.'); else showToast('실패: '+error.message);
}

/* ── 유틸 ── */
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(d) {
  const date=new Date(d), now=new Date();
  if (date.toDateString()===now.toDateString()) return date.getHours().toString().padStart(2,'0')+':'+date.getMinutes().toString().padStart(2,'0');
  return (date.getMonth()+1).toString().padStart(2,'0')+'.'+date.getDate().toString().padStart(2,'0');
}
function formatDateFull(d) {
  const date=new Date(d);
  return date.getFullYear()+'.'+(date.getMonth()+1).toString().padStart(2,'0')+'.'+date.getDate().toString().padStart(2,'0')+' '+date.getHours().toString().padStart(2,'0')+':'+date.getMinutes().toString().padStart(2,'0');
}
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),2500);
}

init();

window.navigate=navigate; window.logout=logout; window.switchLoginTab=switchLoginTab;
window.doLogin=doLogin; window.doRegister=doRegister; window.doSearch=doSearch; window.clearSearch=clearSearch;
window.submitComment=submitComment; window.submitReply=submitReply; window.deleteComment=deleteComment;
window.showReplyForm=showReplyForm; window.hideReplyForm=hideReplyForm;
window.submitPost=submitPost; window.votePost=votePost; window.deletePost=deletePost; window.togglePin=togglePin;
window.adminSearchUser=adminSearchUser; window.adminBanUser=adminBanUser; window.adminUnbanUser=adminUnbanUser;
window.adminPinPost=adminPinPost; window.adminDeletePost=adminDeletePost; window.adminSetLevel=adminSetLevel;
window.prefillBan=prefillBan; window.prefillLevel=prefillLevel; window.quickBanUser=quickBanUser;
</script>
